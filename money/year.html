const h=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},key,u(D.c)));document.open();document.write(h);document.close();}
let saved=null;try{saved=localStorage.getItem('snt-pw')||sessionStorage.getItem('snt-pw')}catch(e){}
if(saved)open(saved).catch(()=>{try{localStorage.removeItem('snt-pw')}catch(e){}});
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const pw=document.getElementById('pw').value;
try{await open(pw);try{localStorage.setItem('snt-pw',pw)}catch(e){}}catch(x){document.getElementById('e').hidden=false}};
</script></body></html>
