var MONS=[["2026-03","March 2026",31],["2026-04","April 2026",30],["2026-05","May 2026",31],["2026-06","June 2026",30]];
var DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function fwd(iso){var p=iso.split("-");return new Date(+p[0],+p[1]-1,1).getDay();}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML;}
var cal=document.getElementById("cal");
MONS.forEach(function(m){
  var wrap=document.createElement("div");wrap.className="mon";
  var dr='<div class="dowr">'+DOW.map(function(x){return "<div>"+x+"</div>";}).join("")+"</div>";
  var start=fwd(m[0]+"-01");var cells="";
  for(var i=0;i<start;i++)cells+='<div class="cell empty"></div>';
  for(var day=1;day<=m[2];day++){
    var iso=m[0]+"-"+String(day).padStart(2,"0");var items=DAYS[iso];
    if(items){
      var seen={};items.forEach(function(it){seen[it.c]=1;});
      var dots=Object.keys(seen).slice(0,6).map(function(c){return '<i style="background:'+(COL[c]||"#999")+'"></i>';}).join("");
      cells+='<div class="cell has" onclick="open(\''+iso+'\')"><div class="dn">'+day+'</div><div class="dots">'+dots+'</div><div class="cnt">'+items.length+'</div></div>';
    } else cells+='<div class="cell"><div class="dn">'+day+'</div></div>';
  }
  wrap.innerHTML="<h2>"+m[1]+"</h2>"+dr+'<div class="grid">'+cells+"</div>";
  cal.appendChild(wrap);
});
function open(iso){
  var items=DAYS[iso]||[];var dt=new Date(iso+"T12:00:00");
  var h="<button class=close onclick=close()>&times;</button><h3>"+dt.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})+" · "+items.length+" items</h3>";
  h+=items.map(function(it){var c=COL[it.c]||"#999";return '<div class="it" style="border-left-color:'+c+'"><span class="c" style="background:'+c+'">'+esc(it.c)+"</span><div>"+esc(it.t)+"</div></div>";}).join("");
  document.getElementById("sheet").innerHTML=h;document.getElementById("ov").classList.add("on");
}
