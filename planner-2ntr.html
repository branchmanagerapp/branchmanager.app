<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>2nd Nature — Planner</title>
<style>
:root{--ink:#15181d;--mut:#697079;--line:#e4e7ea;--bg:#f4f6f5;--card:#fff;
--tree:#1b7f3b;--lawn:#2f9e44;--skate:#c026a3;--fin:#0b5c8a;--misc:#8a8f98}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
.snav{display:flex;gap:2px;background:#111;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;overflow-x:auto;position:sticky;top:0;z-index:30}
.snav a{flex:0 0 auto;color:#cfd2d6;text-decoration:none;font-size:13px;font-weight:700;padding:8px 13px;border-radius:9px;white-space:nowrap}
.snav a.on{background:#fff;color:#111}
.bar{background:#1b1b1b;color:#fff;padding:9px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg,.filt{display:flex;background:#2a2a2a;border-radius:9px;overflow:hidden}
.seg button,.filt button{border:none;background:transparent;color:#cfd2d6;font-size:13px;font-weight:700;padding:7px 12px;cursor:pointer;white-space:nowrap}
.seg button.on{background:#fff;color:#111}
.filt button.on{color:#111}
.filt button.on[data-b=all]{background:#fff}.filt button.on[data-b=tree]{background:#57c273}.filt button.on[data-b=lawn]{background:#5fce80}
.filt button.on[data-b=skate]{background:#e970cf}.filt button.on[data-b=fin]{background:#5aa0d6}
.nav{display:flex;align-items:center;gap:6px;margin-left:auto}
.nav button{border:1px solid #3a3a3a;background:#262626;color:#fff;border-radius:8px;width:32px;height:32px;font-size:16px;cursor:pointer}
.nav .lbl{font-size:14px;font-weight:800;min-width:118px;text-align:center}
.nav .today{width:auto;padding:0 12px;font-size:12.5px;font-weight:700}
.filtrow{background:#242424;padding:8px 12px;display:flex;gap:8px;align-items:center;overflow-x:auto}
.filtrow .lab{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#8a8f98;flex:0 0 auto}
.main{display:flex;gap:12px;align-items:flex-start;max-width:1180px;margin:0 auto;padding:12px}
.calcol{flex:1;min-width:0}
.side{width:270px;flex:0 0 270px;position:sticky;top:52px}
.sidecard{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sidecard .h{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);padding:11px 13px 7px}
.add{padding:0 11px 11px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
.add input{border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:14px}
.add .rowb{display:flex;gap:6px}
.add select{flex:1;border:1px solid var(--line);border-radius:9px;padding:8px 6px;font-size:13px;background:#fff}
.add button{border:none;background:#111;color:#fff;font-weight:800;border-radius:9px;padding:9px;font-size:14px;cursor:pointer}
.traylist{min-height:60px;padding:9px 11px;display:flex;flex-direction:column;gap:7px}
.traylist:empty::after{content:"nothing here — drag a pill in to unschedule it";color:#aeb4bb;font-size:12px;font-style:italic}
/* month grid */
.dowrow{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px}
.dowrow div{font-size:11px;font-weight:800;color:var(--mut);text-align:center;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cell{background:var(--card);border:1px solid var(--line);border-radius:9px;min-height:92px;padding:4px}
.cell.out{background:#f0f1f2;opacity:.55}.cell.today{border-color:var(--tree);box-shadow:0 0 0 1px var(--tree)}.cell.wknd{background:#f7f8f7}
.cell .dn{font-size:12px;font-weight:800;color:var(--mut);padding:1px 3px}.cell.today .dn{color:var(--tree)}
.list{min-height:20px;display:flex;flex-direction:column;gap:4px;padding-top:2px}
.week .cell{min-height:340px}.day .grid{grid-template-columns:1fr}.day .cell{min-height:440px}
.pill{background:#fff;border:1px solid var(--line);border-left:4px solid var(--misc);border-radius:7px;padding:5px 7px;font-size:12px;line-height:1.25;cursor:grab;touch-action:none;display:flex;align-items:flex-start;gap:5px}
.pill.b-tree{border-left-color:var(--tree)}.pill.b-lawn{border-left-color:var(--lawn)}.pill.b-skate{border-left-color:var(--skate)}.pill.b-fin{border-left-color:var(--fin)}
.pill .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.pill .x{color:#c0392b;font-weight:800;cursor:pointer;opacity:.5;flex:0 0 auto}.pill .x:hover{opacity:1}
.pill .ty{font-size:8.5px;font-weight:800;text-transform:uppercase;color:#fff;background:var(--misc);border-radius:20px;padding:1px 5px;flex:0 0 auto}
.pill.b-tree .ty{background:var(--tree)}.pill.b-lawn .ty{background:var(--lawn)}.pill.b-skate .ty{background:var(--skate)}.pill.b-fin .ty{background:var(--fin)}
.sortable-ghost{opacity:.4}.sortable-chosen{box-shadow:0 6px 18px rgba(0,0,0,.2)}
.foot{color:var(--mut);font-size:12px;text-align:center;margin:14px 0 4px}
@media(max-width:760px){.main{flex-direction:column}.side{width:100%;flex:1 0 auto;position:static;order:2}.calcol{order:1}.cell{min-height:66px}.pill .ty{display:none}}
</style></head><body>
<nav class="snav">
  <a href="command-center-2ntr-a91f3d.html">🧭 Dashboard</a>
  <a href="planner-2ntr.html" class="on">🗓️ Planner</a>
  <a href="calendar-apr-jun-b7e21c.html">📅 Past</a>
  <a href="todo-snt-7c21f4.html">✅ To-Do</a>
</nav>
<div class="bar">
  <div class="seg" id="seg"><button data-v="month" class="on">Month</button><button data-v="week">Week</button><button data-v="day">Day</button></div>
  <div class="nav"><button id="prev">‹</button><button id="todayb" class="today">Today</button><button id="next">›</button><span class="lbl" id="lbl"></span></div>
</div>
<div class="filtrow">
  <span class="lab">Show</span>
  <div class="filt" id="filt">
    <button data-b="all" class="on">All</button>
    <button data-b="tree">🌳 Tree</button>
    <button data-b="lawn">🌱 Lawn</button>
    <button data-b="skate">🛹 Skate</button>
    <button data-b="fin">💰 Admin</button>
  </div>
</div>
<div class="main">
  <div class="calcol"><div id="cal"></div><div class="foot">One calendar for all business to-dos · Month/Week/Day · drag pills between days · saved on this device</div></div>
  <aside class="side">
    <div class="sidecard">
      <div class="h">Add a task</div>
      <div class="add">
        <input id="ttl" placeholder="Job or to-do…" enterkeyhint="done">
        <div class="rowb">
          <select id="biz"><option value="tree">🌳 Tree</option><option value="lawn">🌱 Lawn</option><option value="skate">🛹 Skate</option><option value="fin">💰 Admin</option></select>
          <select id="typ"><option value="job">Job</option><option value="todo">To-do</option></select>
        </div>
        <button id="addbtn">Add to Unscheduled</button>
      </div>
      <div class="h" style="padding-top:11px">📥 Unscheduled</div>
      <div class="traylist list" data-day="tray" id="tray"></div>
    </div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script>
const KEY='snt-planner-v1';
const dow=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const mon=['January','February','March','April','May','June','July','August','September','October','November','December'];
let view='month', filt='all';
let anchor=new Date(); anchor.setHours(0,0,0,0);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayISO=()=>{const d=new Date();d.setHours(0,0,0,0);return iso(d);};
const nid=()=>'i'+Math.random().toString(36).slice(2,9);
const show=it=>filt==='all'||it.biz===filt;

let items=load();
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(s))return s;}catch(e){}
  return [
    {id:nid(),title:'CADCO — pay down + unfreeze ordering',biz:'lawn',type:'job',day:'tray'},
    {id:nid(),title:'Call Marissa + send missed $5k',biz:'lawn',type:'todo',day:'tray'},
    {id:nid(),title:'Order Ted Haber X430',biz:'lawn',type:'job',day:'tray'},
    {id:nid(),title:'Close Dennis Lucente fleet order',biz:'lawn',type:'job',day:'tray'},
    {id:nid(),title:'Verify GL insurance $3,279.54 paid',biz:'tree',type:'todo',day:'tray'},
    {id:nid(),title:'Brivo — follow up on API access (door)',biz:'skate',type:'todo',day:'tray'},
    {id:nid(),title:'(845) 987-0553 — hot climb/removal lead',biz:'tree',type:'job',day:'tray'},
    {id:nid(),title:'Colby Moore quote',biz:'tree',type:'job',day:'tray'},
    {id:nid(),title:'Katz estimate',biz:'tree',type:'job',day:'tray'},
    {id:nid(),title:'App Store: publish BM + SkateOS',biz:'fin',type:'todo',day:'tray'},
  ];
}
const save=()=>localStorage.setItem(KEY,JSON.stringify(items));

function pill(it){
  const d=document.createElement('div'); d.className='pill b-'+it.biz; d.dataset.id=it.id;
  d.innerHTML='<span class="tt"></span><span class="ty">'+(it.type==='job'?'Job':'To-do')+'</span><span class="x">×</span>';
  d.querySelector('.tt').textContent=it.title;
  d.querySelector('.x').addEventListener('click',e=>{e.stopPropagation();items=items.filter(x=>x.id!==it.id);save();render();});
  return d;
}
function fill(el){const day=el.dataset.day;items.filter(x=>x.day===day&&show(x)).forEach(it=>el.appendChild(pill(it)));}

function cell(d,out){
  const ds=iso(d),wd=d.getDay();
  const c=document.createElement('div');
  c.className='cell'+(out?' out':'')+(ds===todayISO()?' today':'')+((wd===0||wd===6)?' wknd':'');
  c.innerHTML='<div class="dn">'+((view==='month')?d.getDate():dow[wd]+' '+d.getDate())+'</div>';
  const l=document.createElement('div'); l.className='list'; l.dataset.day=ds; fill(l); c.appendChild(l); return c;
}
function render(){
  document.getElementById('tray').innerHTML=''; fill(document.getElementById('tray'));
  const cal=document.getElementById('cal'); cal.className=view; cal.innerHTML=''; let lbl='';
  if(view==='month'){
    lbl=mon[anchor.getMonth()]+' '+anchor.getFullYear();
    const dr=document.createElement('div'); dr.className='dowrow'; dow.forEach(x=>{const e=document.createElement('div');e.textContent=x;dr.appendChild(e);}); cal.appendChild(dr);
    const g=document.createElement('div'); g.className='grid';
    const first=new Date(anchor.getFullYear(),anchor.getMonth(),1); const start=new Date(first); start.setDate(1-first.getDay());
    for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);g.appendChild(cell(d,d.getMonth()!==anchor.getMonth()));} cal.appendChild(g);
  } else if(view==='week'){
    const s=new Date(anchor); s.setDate(anchor.getDate()-anchor.getDay()); const e=new Date(s); e.setDate(s.getDate()+6);
    lbl=mon[s.getMonth()].slice(0,3)+' '+s.getDate()+' – '+mon[e.getMonth()].slice(0,3)+' '+e.getDate();
    const g=document.createElement('div'); g.className='grid'; for(let i=0;i<7;i++){const d=new Date(s);d.setDate(s.getDate()+i);g.appendChild(cell(d,false));} cal.appendChild(g);
  } else {
    lbl=dow[anchor.getDay()]+', '+mon[anchor.getMonth()]+' '+anchor.getDate();
    const g=document.createElement('div'); g.className='grid'; g.appendChild(cell(new Date(anchor),false)); cal.appendChild(g);
  }
  document.getElementById('lbl').textContent=lbl;
  document.querySelectorAll('.list').forEach(l=>new Sortable(l,{group:'plan',animation:140,delay:130,delayOnTouchOnly:true,ghostClass:'sortable-ghost',chosenClass:'sortable-chosen',onEnd:sync}));
}
function sync(){
  const order=[];
  document.querySelectorAll('.list').forEach(l=>l.querySelectorAll('.pill').forEach(p=>{const it=items.find(x=>x.id===p.dataset.id);if(it){it.day=l.dataset.day;order.push(it);}}));
  const seen=new Set(order.map(x=>x.id)); items=order.concat(items.filter(x=>!seen.has(x.id))); save();
}
document.getElementById('seg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;view=b.dataset.v;document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));render();});
document.getElementById('filt').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;filt=b.dataset.b;document.querySelectorAll('#filt button').forEach(x=>x.classList.toggle('on',x===b));if(filt!=='all')document.getElementById('biz').value=filt;render();});
document.getElementById('prev').addEventListener('click',()=>step(-1));
document.getElementById('next').addEventListener('click',()=>step(1));
document.getElementById('todayb').addEventListener('click',()=>{anchor=new Date();anchor.setHours(0,0,0,0);render();});
function step(n){if(view==='month')anchor.setMonth(anchor.getMonth()+n);else if(view==='week')anchor.setDate(anchor.getDate()+7*n);else anchor.setDate(anchor.getDate()+n);render();}
document.getElementById('addbtn').addEventListener('click',()=>{const t=document.getElementById('ttl');const v=t.value.trim();if(!v)return;items.unshift({id:nid(),title:v,biz:document.getElementById('biz').value,type:document.getElementById('typ').value,day:'tray'});t.value='';save();render();});
document.getElementById('ttl').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('addbtn').click();});
render();
</script>
</body></html>
