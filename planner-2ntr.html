<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>2nd Nature — Planner</title>
<style>
:root{--ink:#15181d;--mut:#697079;--line:#e4e7ea;--bg:#f4f6f5;--card:#fff;
--tree:#1b7f3b;--lawn:#2f9e44;--skate:#c026a3;--fin:#0b5c8a;--misc:#8a8f98}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
.snav{display:flex;gap:2px;background:#111;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;overflow-x:auto;position:sticky;top:0;z-index:30}
.snav a{flex:0 0 auto;color:#cfd2d6;text-decoration:none;font-size:13px;font-weight:700;padding:8px 13px;border-radius:9px;white-space:nowrap}
.snav a.on{background:#fff;color:#111}
.bar{background:#1b1b1b;color:#fff;padding:10px 12px;display:flex;align-items:center;gap:8px;position:sticky;top:44px;z-index:29;flex-wrap:wrap}
.seg{display:flex;background:#2a2a2a;border-radius:9px;overflow:hidden}
.seg button{border:none;background:transparent;color:#cfd2d6;font-size:13px;font-weight:700;padding:7px 13px;cursor:pointer}
.seg button.on{background:#fff;color:#111}
.nav{display:flex;align-items:center;gap:6px;margin-left:auto}
.nav button{border:1px solid #3a3a3a;background:#262626;color:#fff;border-radius:8px;width:32px;height:32px;font-size:16px;cursor:pointer}
.nav .lbl{font-size:14px;font-weight:800;min-width:120px;text-align:center}
.nav .today{width:auto;padding:0 12px;font-size:12.5px;font-weight:700}
.add{display:flex;gap:6px;padding:9px 12px;background:#242424}
.add input{flex:1;min-width:0;border:1px solid #333;background:#2c2c2c;color:#fff;border-radius:9px;padding:9px 11px;font-size:14px}
.add select{border:1px solid #333;background:#2c2c2c;color:#fff;border-radius:9px;padding:0 6px;font-size:13px}
.add button{border:none;background:#fff;color:#111;font-weight:800;border-radius:9px;padding:0 14px;font-size:14px;cursor:pointer}
.tray{background:#eef1f4;border-bottom:1px solid var(--line);padding:8px 12px}
.tray .h{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin-bottom:6px}
.traylist{display:flex;gap:7px;overflow-x:auto;min-height:40px;padding-bottom:2px}
.traylist:empty::after{content:"nothing unscheduled — drag a pill here to unschedule it";color:#aeb4bb;font-size:12px;font-style:italic}
.traylist .pill{flex:0 0 auto;max-width:210px}
.wrap{max-width:1000px;margin:0 auto;padding:10px}
/* month grid */
.dowrow{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px}
.dowrow div{font-size:11px;font-weight:800;color:var(--mut);text-align:center;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cell{background:var(--card);border:1px solid var(--line);border-radius:9px;min-height:88px;padding:4px}
.cell.out{background:#f0f1f2;opacity:.6}
.cell.today{border-color:var(--tree);box-shadow:0 0 0 1px var(--tree)}
.cell.wknd{background:#f7f8f7}
.cell .dn{font-size:12px;font-weight:800;color:var(--mut);padding:1px 3px}
.cell.today .dn{color:var(--tree)}
.list{min-height:20px;display:flex;flex-direction:column;gap:4px;padding-top:2px}
/* week = taller cells in one row */
.week .grid{grid-template-columns:repeat(7,1fr)}
.week .cell{min-height:320px}
/* day = single agenda */
.day .grid{grid-template-columns:1fr}
.day .cell{min-height:400px}
.day .pill{max-width:none}
.pill{background:#fff;border:1px solid var(--line);border-left:4px solid var(--misc);border-radius:7px;padding:5px 7px;font-size:12px;line-height:1.25;cursor:grab;touch-action:none;display:flex;align-items:flex-start;gap:5px}
.pill.b-tree{border-left-color:var(--tree)}.pill.b-lawn{border-left-color:var(--lawn)}.pill.b-skate{border-left-color:var(--skate)}.pill.b-fin{border-left-color:var(--fin)}
.pill .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.pill .x{color:#c0392b;font-weight:800;cursor:pointer;opacity:.5;flex:0 0 auto}
.pill .x:hover{opacity:1}
.pill .ty{font-size:8.5px;font-weight:800;text-transform:uppercase;color:#fff;background:var(--misc);border-radius:20px;padding:1px 5px;flex:0 0 auto}
.pill.b-tree .ty{background:var(--tree)}.pill.b-lawn .ty{background:var(--lawn)}.pill.b-skate .ty{background:var(--skate)}.pill.b-fin .ty{background:var(--fin)}
.sortable-ghost{opacity:.4}.sortable-chosen{box-shadow:0 6px 18px rgba(0,0,0,.2)}
.foot{color:var(--mut);font-size:12px;text-align:center;margin:14px 0 4px}
@media(max-width:640px){.cell{min-height:70px}.pill .ty{display:none}}
</style></head><body>
<nav class="snav">
  <a href="command-center-2ntr-a91f3d.html">🧭 Dashboard</a>
  <a href="planner-2ntr.html" class="on">🗓️ Planner</a>
  <a href="calendar-apr-jun-b7e21c.html">📅 Past</a>
  <a href="todo-snt-7c21f4.html">✅ To-Do</a>
</nav>
<div class="bar">
  <div class="seg" id="seg">
    <button data-v="month" class="on">Month</button>
    <button data-v="week">Week</button>
    <button data-v="day">Day</button>
  </div>
  <div class="nav">
    <button id="prev">‹</button>
    <button id="todayb" class="today">Today</button>
    <button id="next">›</button>
    <span class="lbl" id="lbl"></span>
  </div>
</div>
<div class="add">
  <input id="ttl" placeholder="Add a job or to-do…" enterkeyhint="done">
  <select id="biz"><option value="tree">🌳 Tree</option><option value="lawn">🌱 Lawn</option><option value="skate">🛹 Skate</option><option value="fin">💰 Admin</option></select>
  <select id="typ"><option value="job">Job</option><option value="todo">To-do</option></select>
  <button id="addbtn">Add</button>
</div>
<div class="tray"><div class="h">📥 Unscheduled — drag onto a day</div><div class="traylist list" data-day="tray" id="tray"></div></div>
<div class="wrap"><div id="cal"></div><div class="foot">Modeled on the Branch Manager schedule · drag pills between days · saved on this device</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script>
const KEY='snt-planner-v1';
const dow=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const mon=['January','February','March','April','May','June','July','August','September','October','November','December'];
let view='month';
let anchor=new Date(); anchor.setHours(0,0,0,0);

function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parse(s){const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function todayISO(){const d=new Date();d.setHours(0,0,0,0);return iso(d);}
function nid(){return 'i'+Math.random().toString(36).slice(2,9);}

let items=load();
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(s))return s;}catch(e){}
  return [
    {id:nid(),title:'CADCO — pay down + unfreeze ordering',biz:'lawn',type:'job',day:'tray'},
    {id:nid(),title:'Call Marissa + send missed $5k',biz:'lawn',type:'todo',day:'tray'},
    {id:nid(),title:'Order Ted Haber X430',biz:'lawn',type:'job',day:'tray'},
    {id:nid(),title:'Close Dennis Lucente fleet order',biz:'lawn',type:'job',day:'tray'},
    {id:nid(),title:'Verify GL insurance $3,279.54 paid',biz:'tree',type:'todo',day:'tray'},
    {id:nid(),title:'Brivo — follow up on API access (door)',biz:'skate',type:'todo',day:'tray'},
    {id:nid(),title:'(845) 987-0553 — hot climb/removal lead',biz:'tree',type:'job',day:'tray'},
    {id:nid(),title:'Colby Moore quote',biz:'tree',type:'job',day:'tray'},
    {id:nid(),title:'Katz estimate',biz:'tree',type:'job',day:'tray'},
    {id:nid(),title:'App Store: publish BM + SkateOS',biz:'fin',type:'todo',day:'tray'},
  ];
}
function save(){localStorage.setItem(KEY,JSON.stringify(items));}

function pill(it){
  const d=document.createElement('div');
  d.className='pill b-'+it.biz; d.dataset.id=it.id;
  d.innerHTML='<span class="tt"></span><span class="ty">'+(it.type==='job'?'Job':'To-do')+'</span><span class="x">×</span>';
  d.querySelector('.tt').textContent=it.title;
  d.querySelector('.x').addEventListener('click',e=>{e.stopPropagation();items=items.filter(x=>x.id!==it.id);save();render();});
  return d;
}
function fill(listEl){
  const day=listEl.dataset.day;
  items.filter(x=>x.day===day).forEach(it=>listEl.appendChild(pill(it)));
}

function cell(d,outMonth){
  const ds=iso(d), wd=d.getDay();
  const c=document.createElement('div');
  c.className='cell'+(outMonth?' out':'')+(ds===todayISO()?' today':'')+((wd===0||wd===6)?' wknd':'');
  const label=(view==='day'||view==='week')?(dow[wd]+' '+d.getDate()):d.getDate();
  c.innerHTML='<div class="dn">'+label+'</div>';
  const l=document.createElement('div'); l.className='list'; l.dataset.day=ds;
  fill(l); c.appendChild(l); return c;
}

function render(){
  // wipe past-window? no — keep all; just render current view
  document.getElementById('tray').innerHTML=''; fill(document.getElementById('tray'));
  const cal=document.getElementById('cal'); cal.className=view; cal.innerHTML='';
  let lbl='';
  if(view==='month'){
    lbl=mon[anchor.getMonth()]+' '+anchor.getFullYear();
    const dr=document.createElement('div'); dr.className='dowrow';
    dow.forEach(x=>{const e=document.createElement('div');e.textContent=x;dr.appendChild(e);});
    cal.appendChild(dr);
    const g=document.createElement('div'); g.className='grid';
    const first=new Date(anchor.getFullYear(),anchor.getMonth(),1);
    const start=new Date(first); start.setDate(1-first.getDay());
    for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);g.appendChild(cell(d,d.getMonth()!==anchor.getMonth()));}
    cal.appendChild(g);
  } else if(view==='week'){
    const s=new Date(anchor); s.setDate(anchor.getDate()-anchor.getDay());
    const e=new Date(s); e.setDate(s.getDate()+6);
    lbl=mon[s.getMonth()].slice(0,3)+' '+s.getDate()+' – '+mon[e.getMonth()].slice(0,3)+' '+e.getDate();
    const g=document.createElement('div'); g.className='grid';
    for(let i=0;i<7;i++){const d=new Date(s);d.setDate(s.getDate()+i);g.appendChild(cell(d,false));}
    cal.appendChild(g);
  } else {
    lbl=dow[anchor.getDay()]+', '+mon[anchor.getMonth()]+' '+anchor.getDate();
    const g=document.createElement('div'); g.className='grid';
    g.appendChild(cell(new Date(anchor),false)); cal.appendChild(g);
  }
  document.getElementById('lbl').textContent=lbl;
  document.querySelectorAll('.list').forEach(l=>{
    new Sortable(l,{group:'plan',animation:140,delay:130,delayOnTouchOnly:true,ghostClass:'sortable-ghost',chosenClass:'sortable-chosen',onEnd:sync});
  });
}
function sync(){
  const order=[];
  document.querySelectorAll('.list').forEach(l=>{
    l.querySelectorAll('.pill').forEach(p=>{const it=items.find(x=>x.id===p.dataset.id);if(it){it.day=l.dataset.day;order.push(it);}});
  });
  const seen=new Set(order.map(x=>x.id));
  items=order.concat(items.filter(x=>!seen.has(x.id)));
  save();
}

document.getElementById('seg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  view=b.dataset.v; document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b)); render();});
document.getElementById('prev').addEventListener('click',()=>{step(-1);});
document.getElementById('next').addEventListener('click',()=>{step(1);});
document.getElementById('todayb').addEventListener('click',()=>{anchor=new Date();anchor.setHours(0,0,0,0);render();});
function step(n){if(view==='month')anchor.setMonth(anchor.getMonth()+n);else if(view==='week')anchor.setDate(anchor.getDate()+7*n);else anchor.setDate(anchor.getDate()+n);render();}
document.getElementById('addbtn').addEventListener('click',()=>{const t=document.getElementById('ttl');const v=t.value.trim();if(!v)return;
  items.unshift({id:nid(),title:v,biz:document.getElementById('biz').value,type:document.getElementById('typ').value,day:'tray'});t.value='';save();render();});
document.getElementById('ttl').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('addbtn').click();});
render();
</script>
</body></html>
