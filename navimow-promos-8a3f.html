<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Navimow Promo Tracker</title>
<style>
:root{--ink:#15181d;--mut:#697079;--line:#e4e7ea;--bg:#f4f6f5;--card:#fff;--green:#1b7f3b;--red:#c0392b;--amber:#b45309}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;-webkit-text-size-adjust:100%}
.hd{background:#14532d;color:#fff;padding:calc(16px + env(safe-area-inset-top)) 16px 14px}
.hd h1{margin:0;font-size:19px;font-weight:800}.hd p{margin:4px 0 0;font-size:12.5px;opacity:.85}
.wrap{max-width:820px;margin:0 auto;padding:14px 14px 50px}
.promo{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0;margin:12px 0;overflow:hidden;border-left:5px solid var(--mut)}
.promo.live{border-left-color:var(--green)}.promo.soon{border-left-color:var(--amber)}.promo.dead{border-left-color:#b9bcc2;opacity:.6}
.ptop{padding:13px 15px;display:flex;align-items:flex-start;gap:10px}
.ptop .nm{font-weight:800;font-size:16px;flex:1}
.badge{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:3px 9px;border-radius:20px;color:#fff;white-space:nowrap}
.b-live{background:var(--green)}.b-soon{background:var(--amber)}.b-dead{background:#8a8f98}
.count{font-size:13px;color:var(--mut);margin:2px 15px 0}
.count b{font-size:15px}
.count.live b{color:var(--green)}.count.soon b{color:var(--amber)}.count.dead b{color:#8a8f98}
table{width:100%;border-collapse:collapse;margin:10px 0 4px}
th,td{text-align:left;padding:8px 15px;font-size:13.5px;border-top:1px solid var(--line)}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);font-weight:700}
td.p{text-align:right;font-weight:800;color:var(--green)}
td.r{text-align:right;color:var(--mut);text-decoration:line-through;font-size:12px}
td.off{text-align:right;font-weight:700;color:var(--amber);font-size:12px}
.src{font-size:11px;color:var(--mut);padding:4px 15px 12px}
.note{background:#fff7e6;border:1px solid #f6dca0;border-radius:12px;padding:12px 14px;font-size:13px;margin:12px 0}.note b{color:var(--amber)}
.foot{color:var(--mut);font-size:11.5px;text-align:center;margin-top:18px}
</style></head><body>
<div class="hd"><h1>🌱 Navimow Promo Tracker</h1><p>Live manufacturer deals + exactly when they end · so Smart Lawn always matches the factory price</p></div>
<div class="wrap">
  <div class="note" id="topnote"></div>
  <div id="promos"></div>
  <div class="foot">Prices from Navimow / Segway Prime Day sale coverage (9to5toys, Jun 23 2026). Verify on navimow.com before quoting. Countdown updates live on this device.</div>
</div>
<script>
// ── Edit this list as deals change. dates = local midnight. ──
const PROMOS = [
  {
    name:'Navimow Prime Day Sale',
    start:'2026-06-23', end:'2026-07-08',
    note:'X430 = $2,099 ($400 off). Dennis quote matches this. File the 100% Prime Day rebate on units sold during the window.',
    models:[
      {m:'X430 (1.0 ac)',   sale:2099, reg:2499},
      {m:'X450 (1.5 ac)',   sale:2539, reg:2999},
      {m:'i215 LiDAR',      sale:1399, reg:1599},
      {m:'i210 AWD',        sale:1049, reg:1299},
      {m:'i206 AWD',        sale:849,  reg:999},
    ]
  },
  // Add future promos here, e.g.:
  // { name:'Labor Day Sale', start:'2026-08-28', end:'2026-09-02', note:'', models:[...] },
];

const fmt=n=>'$'+n.toLocaleString();
const DAY=864e5;
function midnight(s){const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]).getTime();}
function daysLeft(end){return Math.ceil((midnight(end)+DAY - Date.now())/DAY);}

const now=Date.now();
let live=0,soon=0;
const host=document.getElementById('promos');
PROMOS.forEach(p=>{
  const s=midnight(p.start), e=midnight(p.end)+DAY;
  const dl=daysLeft(p.end);
  let cls,badge,bcls,ccls,txt;
  if(now < s){cls='';badge='UPCOMING';bcls='b-dead';ccls='dead';txt='Starts '+p.start;}
  else if(now >= e){cls='dead';badge='ENDED';bcls='b-dead';ccls='dead';txt='Ended '+p.end;}
  else if(dl<=3){cls='soon';badge='ENDS SOON';bcls='b-soon';ccls='soon';txt=dl+' day'+(dl===1?'':'s')+' left — ends '+p.end;soon++;}
  else {cls='live';badge='LIVE';bcls='b-live';ccls='live';txt=dl+' days left — ends '+p.end;live++;}
  const rows=p.models.map(x=>{
    const off=Math.round((1-x.sale/x.reg)*100);
    return `<tr><td>${x.m}</td><td class="p">${fmt(x.sale)}</td><td class="r">${fmt(x.reg)}</td><td class="off">−${off}%</td></tr>`;
  }).join('');
  const div=document.createElement('div');
  div.className='promo '+cls;
  div.innerHTML=`<div class="ptop"><div class="nm">${p.name}</div><span class="badge ${bcls}">${badge}</span></div>
    <div class="count ${ccls}"><b>${txt}</b></div>
    <table><tr><th>Model</th><th style="text-align:right">Sale</th><th style="text-align:right">MSRP</th><th style="text-align:right">Off</th></tr>${rows}</table>
    ${p.note?`<div class="src">📌 ${p.note}</div>`:''}`;
  host.appendChild(div);
});
document.getElementById('topnote').innerHTML = live||soon
  ? `<b>${live+soon} active deal${live+soon===1?'':'s'}.</b> Match these prices on every Smart Lawn quote while they run — a customer can price-check navimow.com in seconds.`
  : `No active manufacturer deals right now — quote at your normal margin off MSRP.`;
</script>
</body></html>
