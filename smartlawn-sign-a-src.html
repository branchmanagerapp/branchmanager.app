<!DOCTYPE html>

<style>
  @page { size: 24in 18in; margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #888; }
  .sign {
    width: 24in; height: 18in;
    background: #ffffff;
    position: relative;
    overflow: hidden;
    font-family: 'Arial Black', 'Arial', 'Helvetica Neue', sans-serif;
    display: flex; flex-direction: column;
  }
  .main {
    flex: 1;
    display: flex; flex-direction: column;
    padding: 1.0in 1.1in 0.45in 1.1in;
  }
  .toprow { flex: 1; display: flex; gap: 0.9in; }
  .left { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
  .headline {
    font-weight: 900;
    color: #1d1d1f;
    font-size: 3.05in;
    line-height: 0.98;
    letter-spacing: -0.06in;
  }
  .headline .accent { color: #4a8a10; }
  .sub {
    font-family: 'Helvetica Neue', 'Arial', sans-serif;
    font-weight: 700;
    color: #1d1d1f;
    font-size: 0.85in;
    letter-spacing: 0.01in;
    margin-top: 0.4in;
  }
  .phone {
    font-weight: 900;
    color: #1d1d1f;
    font-size: 2.2in;
    letter-spacing: -0.04in;
    white-space: nowrap;
    margin-top: 0.35in;
  }
  .right {
    width: 5.6in; flex: none;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 0.35in;
  }
  .qrbox {
    width: 5.2in; height: 5.2in;
    background: #fff;
    border: 0.09in solid #1d1d1f;
    border-radius: 0.25in;
    padding: 0.3in;
  }
  .qrbox svg { width: 100%; height: 100%; }
  .qrcta {
    font-weight: 900;
    color: #4a8a10;
    font-size: 0.62in;
    text-align: center;
    line-height: 1.15;
    text-transform: uppercase;
  }
  .bar {
    height: 3.1in;
    background: #6abb1e;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 1.1in;
  }
  .domain {
    font-weight: 900;
    color: #ffffff;
    font-size: 1.45in;
    letter-spacing: -0.02in;
    white-space: nowrap;
  }
  .dealer {
    font-family: 'Helvetica Neue', 'Arial', sans-serif;
    font-weight: 700;
    color: #ffffff;
    font-size: 0.52in;
    text-align: right;
    white-space: nowrap;
    line-height: 1.25;
  }
  @media screen {
    body { display: flex; justify-content: center; padding: 20px; }
    .wrap { transform-origin: top center; }
  }
