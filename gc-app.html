<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ground Control">
<meta name="theme-color" content="#111111">
<meta name="robots" content="noindex,nofollow">
<title>Ground Control</title>
<link rel="manifest" href="gc-manifest.json">
<link rel="apple-touch-icon" href="gc-icons/icon-192.png">
<style>
:root{--ink:#15181d;--mut:#697079;--line:#e5e8eb;--bg:#f4f6f5;--card:#fff;
--tree:#1b7f3b;--lawn:#2f9e44;--skate:#c026a3;--fin:#0b5c8a;--misc:#8a8f98;--navh:62px}
[data-theme=dark]{--ink:#e6e8eb;--mut:#9aa0a8;--line:#2c3038;--bg:#15171b;--card:#1e2127}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%;padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom))}
.hd{background:#111;color:#fff;padding:calc(16px + env(safe-area-inset-top)) 16px 13px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.hd h1{margin:0;font-size:17px;font-weight:800}.hd .sub{font-size:11.5px;opacity:.7;margin-top:1px}
.hd .moon{margin-left:auto;background:#2a2a2a;border:none;color:#fff;width:34px;height:34px;border-radius:9px;font-size:15px;cursor:pointer}
.wrap{max-width:820px;margin:0 auto;padding:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px}
.chip{flex:0 0 auto;font-size:12.5px;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.chip.on{background:#111;color:#fff;border-color:#111}
[data-theme=dark] .chip.on{background:#fff;color:#111;border-color:#fff}
.task{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin:8px 0;display:flex;align-items:flex-start;gap:11px;border-left:4px solid var(--misc)}
.task.b-tree{border-left-color:var(--tree)}.task.b-lawn{border-left-color:var(--lawn)}.task.b-skate{border-left-color:var(--skate)}.task.b-fin{border-left-color:var(--fin)}
.ck{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:2px solid #c3c8cf;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:800;margin-top:1px}
.ck.done{background:var(--tree);border-color:var(--tree)}
.task .tt{flex:1;min-width:0;font-size:14.5px;line-height:1.35}
.task.gone .tt{text-decoration:line-through;color:var(--mut)}
.task .meta{font-size:11.5px;color:var(--mut);margin-top:2px}
.task .ty{font-size:9px;font-weight:800;text-transform:uppercase;color:#fff;background:var(--misc);border-radius:20px;padding:2px 7px;flex:0 0 auto;margin-top:3px}
.task.b-tree .ty{background:var(--tree)}.task.b-lawn .ty{background:var(--lawn)}.task.b-skate .ty{background:var(--skate)}.task.b-fin .ty{background:var(--fin)}
.task .undo{font-size:12px;font-weight:700;color:var(--fin);cursor:pointer;flex:0 0 auto;margin-top:3px}
.addbar{display:flex;gap:6px;margin:4px 0 10px}
.addbar input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 11px;font-size:14px}
.addbar select{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:0 6px;font-size:13px}
.addbar button{border:none;background:#111;color:#fff;font-weight:800;border-radius:10px;padding:0 15px;font-size:14px;cursor:pointer}
[data-theme=dark] .addbar button{background:#fff;color:#111}
.empty{text-align:center;color:var(--mut);font-size:13.5px;padding:26px 10px}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:16px 2px 6px}
.linkc{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:8px 0}
.linkc a{display:block;padding:11px 13px;border-top:1px solid var(--line);color:var(--fin);text-decoration:none;font-weight:600;font-size:14px}
.linkc a:first-child{border-top:0}.linkc a .d{color:var(--mut);font-weight:400;font-size:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin:8px 0;font-size:13.5px}
.stat b{color:var(--ink)}
iframe{width:100%;height:72vh;border:1px solid var(--line);border-radius:12px}
.nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--navh) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--card);border-top:1px solid var(--line);display:flex;z-index:20}
.nav button{flex:1;border:none;background:none;color:var(--mut);font-size:10.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
.nav button .i{font-size:20px}
.nav button.on{color:var(--tree)}
.badge{background:var(--skate);color:#fff;font-size:9px;font-weight:800;border-radius:20px;padding:1px 5px;position:relative;top:-2px}
</style>
</head>
<body>
<div class="hd"><div><h1 id="htitle">🧭 Ground Control</h1><div class="sub" id="hsub">All your businesses, one app</div></div><button class="moon" id="moon" onclick="toggleTheme()">🌙</button></div>
<div class="wrap" id="view"></div>

<nav class="nav" id="nav">
  <button data-p="hub" class="on" onclick="go('hub')"><span class="i">🧭</span>Hub</button>
  <button data-p="todo" onclick="go('todo')"><span class="i">✅</span>To-Do</button>
  <button data-p="plan" onclick="go('plan')"><span class="i">🗓️</span>Plan</button>
  <button data-p="archive" onclick="go('archive')"><span class="i">🗄️</span>Archive</button>
</nav>

<script>
var KEY='snt-planner-v1';
var page='hub', filt='all';
function items(){try{var s=JSON.parse(localStorage.getItem(KEY));return Array.isArray(s)?s:seed();}catch(e){return seed();}}
function save(a){localStorage.setItem(KEY,JSON.stringify(a));}
function seed(){var s=[
 {id:uid(),title:'CADCO — pay down + unfreeze ordering',biz:'lawn',type:'job',day:'tray'},
 {id:uid(),title:'Call Marissa + send missed $5k',biz:'lawn',type:'todo',day:'tray'},
 {id:uid(),title:'Order Ted Haber X430',biz:'lawn',type:'job',day:'tray'},
 {id:uid(),title:'Close Dennis Lucente fleet order',biz:'lawn',type:'job',day:'tray'},
 {id:uid(),title:'Verify GL insurance $3,279.54 paid',biz:'tree',type:'todo',day:'tray'},
 {id:uid(),title:'Brivo — follow up on API access (door)',biz:'skate',type:'todo',day:'tray'},
 {id:uid(),title:'(845) 987-0553 — hot climb/removal lead',biz:'tree',type:'job',day:'tray'},
 {id:uid(),title:'Colby Moore quote',biz:'tree',type:'job',day:'tray'},
 {id:uid(),title:'Katz estimate',biz:'tree',type:'job',day:'tray'},
 {id:uid(),title:'App Store: publish BM + SkateOS',biz:'fin',type:'todo',day:'tray'}
];save(s);return s;}
function uid(){return 'i'+Math.random().toString(36).slice(2,9);}
function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
var BN={tree:'Tree',lawn:'SmartLawn',skate:'Skate',fin:'Admin'};

function toggleTheme(){var d=document.documentElement;var on=d.getAttribute('data-theme')==='dark';d.setAttribute('data-theme',on?'':'dark');localStorage.setItem('gc-theme',on?'':'dark');document.getElementById('moon').textContent=on?'🌙':'☀️';}
if(localStorage.getItem('gc-theme')==='dark'){document.documentElement.setAttribute('data-theme','dark');}

function go(p){page=p;document.querySelectorAll('#nav button').forEach(function(b){b.classList.toggle('on',b.dataset.p===p);});render();}

function chips(){
  var bs=[['all','All'],['tree','🌳 Tree'],['lawn','🌱 Lawn'],['skate','🛹 Skate'],['fin','💰 Admin']];
  return '<div class="chips">'+bs.map(function(b){return '<div class="chip'+(filt===b[0]?' on':'')+'" onclick="setFilt(\''+b[0]+'\')">'+b[1]+'</div>';}).join('')+'</div>';
}
function setFilt(f){filt=f;render();}
function match(it){return filt==='all'||it.biz===filt;}

function taskRow(it,archived){
  var day=(it.day&&it.day!=='tray')?('<div class="meta">📅 '+it.day+'</div>'):'';
  if(archived){
    return '<div class="task gone b-'+it.biz+'"><div class="ck done" onclick="undone(\''+it.id+'\')">✓</div><div class="tt">'+esc(it.title)+'<div class="meta">'+BN[it.biz]+' · done'+(it.doneAt?' '+it.doneAt:'')+'</div></div><div class="undo" onclick="undone(\''+it.id+'\')">Restore</div></div>';
  }
  return '<div class="task b-'+it.biz+'"><div class="ck" onclick="done(\''+it.id+'\')"></div><div class="tt">'+esc(it.title)+day+'</div><span class="ty">'+(it.type==='job'?'Job':'To-do')+'</span></div>';
}
function done(id){var a=items();var it=a.find(function(x){return x.id===id;});if(it){it.done=true;it.doneAt=new Date().toISOString().slice(0,10);}save(a);render();}
function undone(id){var a=items();var it=a.find(function(x){return x.id===id;});if(it){it.done=false;delete it.doneAt;}save(a);render();}

function addTask(){
  var t=document.getElementById('nt');var v=t.value.trim();if(!v)return;
  var a=items();a.unshift({id:uid(),title:v,biz:document.getElementById('nb').value,type:document.getElementById('ny').value,day:'tray'});save(a);t.value='';render();
}

function render(){
  var v=document.getElementById('view');var a=items();
  document.getElementById('htitle').textContent = page==='hub'?'🧭 Ground Control':page==='todo'?'✅ To-Do':page==='plan'?'🗓️ Plan':'🗄️ Archive';
  if(page==='todo'){
    var open=a.filter(function(x){return !x.done&&match(x);});
    v.innerHTML=chips()
      +'<div class="addbar"><input id="nt" placeholder="Add a to-do or job…" enterkeyhint="done"><select id="nb"><option value="tree">🌳</option><option value="lawn">🌱</option><option value="skate">🛹</option><option value="fin">💰</option></select><select id="ny"><option value="todo">To-do</option><option value="job">Job</option></select><button onclick="addTask()">Add</button></div>'
      +(open.length?open.map(function(it){return taskRow(it,false);}).join(''):'<div class="empty">Nothing open here 🎉</div>');
    if(filt!=='all')document.getElementById('nb').value=filt;
    document.getElementById('nt').addEventListener('keydown',function(e){if(e.key==='Enter')addTask();});
  } else if(page==='archive'){
    var done=a.filter(function(x){return x.done&&match(x);}).sort(function(x,y){return (y.doneAt||'').localeCompare(x.doneAt||'');});
    v.innerHTML=chips()+(done.length?done.map(function(it){return taskRow(it,true);}).join(''):'<div class="empty">Nothing archived yet — tap the circle on a to-do to complete it.</div>');
  } else if(page==='plan'){
    v.innerHTML='<div class="stat">Your cross-business calendar — drag jobs &amp; to-dos onto days. Shares the same tasks as this To-Do list.</div><iframe src="planner-2ntr.html" title="Planner"></iframe>';
  } else {
    var openN=a.filter(function(x){return !x.done;}).length;
    v.innerHTML=
      '<div class="stat">💵 <b>Do now:</b> Pay CADCO to unfreeze Ted Haber’s X430 · close Dennis Lucente · call Marissa (missed $5k).</div>'
      +'<div class="stat">🟡 <b>Waiting:</b> Skate door (Brivo API) · SmartLawn Stripe key to verify payments · SmartLawn site repo write.</div>'
      +'<h2 class="sec">Open tasks: '+openN+' <span class="badge" onclick="go(\'todo\')">view</span></h2>'
      +'<h2 class="sec">Pages</h2>'
      +'<div class="linkc">'
      +'<a href="https://skateos.com/tutorial">🛹 SkateOS staff tutorial</a>'
      +'<a href="https://skateos.com/door">🛹 Door status</a>'
      +'<a href="https://skateos.com/j2">🛹 Inventory → Square</a>'
      +'<a href="https://branchmanager.app/smartlawn-lucente-d4e91b.html">🌱 Dennis Lucente quote</a>'
      +'<a href="https://branchmanager.app/smartlawn-redesign-preview.html">🌱 SmartLawn redesign preview</a>'
      +'<a href="https://branchmanager.app">🌳 Branch Manager app</a>'
      +'<a href="https://branchmanager.app/fleet-budget-b1e454.html">🌳 Fleet &amp; budget</a>'
      +'<a href="https://branchmanager.app/cpa2025-1aefb4.html">💰 CPA portal <span class="d">· pw Fay25</span></a>'
      +'<a href="https://branchmanager.app/todo-snt-7c21f4.html">✅ Encrypted to-do <span class="d">· pw snt2026</span></a>'
      +'</div>';
  }
}

if('serviceWorker' in navigator){navigator.serviceWorker.register('gc-sw.js').catch(function(){});}
render();
</script>
</body>
</html>
