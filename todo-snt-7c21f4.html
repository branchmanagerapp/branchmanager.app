<style>
:root{--ink:#16181d;--mut:#6b7280;--line:#e6e8ec;--green:#1b7f3b;--bg:#f5f6f8;--card:#fff;--amber:#b45309;}
*{box-sizing:border-box;-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;padding:0 0 60px}
.top{position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(14px + env(safe-area-inset-top)) 18px 14px;z-index:10}
.top h1{font-size:18px;margin:0;font-weight:800}.top .u{font-size:12px;color:var(--mut);margin-top:2px}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px}
h1{font-size:22px;margin:22px 0 4px}h2{font-size:19px;margin:30px 0 10px;padding-top:14px;border-top:2px solid var(--line);font-weight:800}
h3{font-size:15px;margin:16px 0 6px;color:var(--mut);font-weight:700}hr{border:none;border-top:1px solid var(--line);margin:6px 0}
p{margin:8px 0;color:#33373d;font-size:15px}
.task{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;font-size:15px}
.task.sub{margin-left:20px;background:#fafbfc;font-size:14px}
.task .box{flex:0 0 auto;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;margin-top:1px}
.task.todo .box{border:2px solid #c3c8cf;color:transparent}.task.done .box{background:var(--green);color:#fff}
.task.done .txt{color:var(--mut)}.task.wip .box{background:var(--amber);color:#fff}
.bullet{margin:6px 0;font-size:14.5px;color:#33373d}.bullet.sub{margin-left:18px;color:var(--mut);font-size:14px}
.num{margin:7px 0;font-size:15px}
code{background:#eef0f3;border-radius:5px;padding:1px 5px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
a{color:var(--green);word-break:break-word}strong{color:var(--ink)}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 14px;margin:8px 0}summary{cursor:pointer;padding:10px 0;font-size:15px}
/* lock */
#lock{position:fixed;inset:0;background:linear-gradient(160deg,#12331a,#0f1115);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:24px;z-index:100}
#lock .card{background:#fff;border-radius:20px;padding:30px 24px;max-width:340px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
#lock h2{border:none;margin:0 0 6px;font-size:20px}#lock p{color:var(--mut);font-size:13px;margin:0 0 18px}
#lock input{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:12px;font-size:17px;text-align:center;font-family:inherit;margin-bottom:12px}
#lock input:focus{outline:none;border-color:var(--green)}
#lock button{width:100%;padding:14px;border:none;border-radius:12px;background:var(--green);color:#fff;font-size:16px;font-weight:800;cursor:pointer}
#lock .err{color:#c0392b;font-size:13px;height:16px;margin-top:8px}
#app{display:none}
</style></head><body>

const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(pw){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(SALT),iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(IV)},key,b64d(CT));
  return new TextDecoder().decode(pt);
}
async function tryUnlock(pw,remember){
  try{
    const htmlContent=await decrypt(pw);
    document.getElementById('content').innerHTML=htmlContent;
    document.getElementById('lock').style.display='none';
    document.getElementById('app').style.display='block';
    if(remember) localStorage.setItem('td_pw',pw);
    return true;
  }catch(e){ return false; }
}
document.getElementById('go').addEventListener('click',async()=>{
  const pw=document.getElementById('pw').value;
  const ok=await tryUnlock(pw,true);
  if(!ok) document.getElementById('err').textContent='Wrong password';
});
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('go').click();});
// auto-unlock on this device if previously entered
(async()=>{const saved=localStorage.getItem('td_pw'); if(saved){const ok=await tryUnlock(saved,false); if(!ok)localStorage.removeItem('td_pw');}})();
