// Wait for deferred page scripts (SettingsPage, QuotesPage, ModeSelector, etc.) to finish loading
// before calling loadPage(). Previously we ran synchronously from an inline script, which fired
// BEFORE the defer'd <script> tags had evaluated, causing "SettingsPage is not defined" crashes
// and dead submit handlers. DOMContentLoaded fires after all defer scripts have run.
function bmInit() {
if (checkAuth()) {
  // v811: GMB OAuth implicit-flow callback. Google returns `#access_token=...`
  // in the URL hash; we must parse + store BEFORE the router reads the hash
  // for page routing (otherwise the token sits in the hash unconsumed and the
  // router falls through to default page).
  try {
    var _h = window.location.hash || '';
    // A Supabase email-confirm / magic-link return ALSO carries access_token=
    // in the hash but with type=signup|magiclink|invite|recovery. That belongs
    // to handleEmailConfirmReturn, NOT the GMB OAuth handler — don't hijack it.
    var _isSupaAuth = /[#&]type=(signup|magiclink|invite|recovery)/.test(_h);
    if (_h && _h.indexOf('access_token=') >= 0 && !_isSupaAuth
        && typeof SettingsPage !== 'undefined' && SettingsPage._gmbCheckCallback) {
      SettingsPage._gmbCheckCallback();
    }
  } catch(e) { console.warn('GMB callback hook failed', e); }

  // Role-based default page
  var hashPage = window.location.hash ? window.location.hash.slice(1) : '';
  var savedPage = '';
  var savedDetail = null;
  try { savedPage = localStorage.getItem('bm-last-page') || ''; } catch(e) {}
  try {
    var rawDetail = localStorage.getItem('bm-last-detail');
    if (rawDetail) {
      savedDetail = JSON.parse(rawDetail);
      // Expire stale detail (> 4 hours) so a cold reopen doesn't jump into an old record
      if (!savedDetail.ts || (Date.now() - savedDetail.ts) > 4 * 3600 * 1000) savedDetail = null;
    }
  } catch(e) { savedDetail = null; }

  // Mode selector DISABLED v361/v362 — nav filter was hiding items even in
  // "owner" mode. All users land on dashboard regardless of stored mode.
  // Purge any stored mode so nothing downstream re-applies.
  try { localStorage.removeItem('bm-app-mode'); } catch(e){}
  var defaultPage = 'dashboard';

  // v656: legacy #marketing folds into SocialBranch's leads tab.
  if (hashPage === 'marketing') {
    hashPage = 'socialbranch';
    if (typeof SocialBranch !== 'undefined') SocialBranch._tab = 'leads';
  }
  // v978: a full RELOAD (Cmd+R / pull-to-refresh) always lands on the dashboard —
  // ignore the preserved hash, last-saved page, and any saved detail. Genuine
  // fresh navigations / deep-links (type 'navigate') still resume where you left off.
  var _navType = '';
  try { _navType = (performance.getEntriesByType('navigation')[0] || {}).type || ''; } catch(e) {}
  var targetPage;
  if (_navType === 'reload') {
    targetPage = defaultPage;
    savedDetail = null;
  } else {
    // Priority: URL hash > saved page > default
    targetPage = (hashPage && pageRenderers[hashPage])
      ? hashPage
      : ((savedPage && pageRenderers[savedPage]) ? savedPage : defaultPage);
  }
  // TEMP (Books hang, Jun 2026): the Books page currently hangs the renderer
  // (RESULT_CODE_HUNG). Never AUTO-boot into it on a cold load, or a reopen gets
  // trapped on a dead page ("no page loads"). Fall back to dashboard and clear the
  // saved route. In-app clicking of Books still works normally. REMOVE this guard
  // once the Books render hang is fixed.
  if (targetPage === 'books') {
    targetPage = 'dashboard';
    try { localStorage.removeItem('bm-last-page'); } catch(e) {}
  }
  loadPage(targetPage);

  // v816 white-label: load the logged-in tenant's branding into CompanyInfo,
  // non-blocking. localStorage-cached, so only the first login per device
  // shows a brief default-brand flash; every load after is branded instantly.
  // If it actually applied a tenant (returns true) and we're still on the
  // first-rendered page, re-render so branded values show immediately.
  try {
    if (typeof CompanyInfo !== 'undefined' && CompanyInfo.loadTenantFromSession) {
      CompanyInfo.loadTenantFromSession().then(function(applied) {
        if (applied && typeof loadPage === 'function' && window._currentPage) {
          loadPage(window._currentPage);
        }
      });
    }
  } catch (e) { /* never block boot on branding */ }

  // v675: handle Stripe Checkout redirect back to BM. subscription-create-
  // checkout sets success_url with ?subscription=success. Toast the user,
  // strip the param from the URL, force-refresh subscription state once
  // the stripe-webhook has had a moment to land (~2-5s typical).
  try {
    var _qsSub = new URLSearchParams(location.search);
    var _subResult = _qsSub.get('subscription');
    if (_subResult === 'success' || _subResult === 'cancel') {
      _qsSub.delete('subscription');
      _qsSub.delete('session_id');
      var _newQs = _qsSub.toString();
      history.replaceState({}, '', location.pathname + (_newQs ? '?' + _newQs : '') + location.hash);
      setTimeout(function() {
        if (typeof UI !== 'undefined' && UI.toast) {
          UI.toast(_subResult === 'success' ? '🎉 Subscription active — welcome!' : 'Checkout canceled');
        }
        if (typeof Subscription !== 'undefined' && Subscription.refreshFromCloud) {
          Subscription.refreshFromCloud().catch(function(){});
          setTimeout(function() { Subscription.refreshFromCloud().catch(function(){}); }, 4000);
        }
      }, 600);
    }
  } catch(e) {}

  // v670: refresh subscription state from cloud at boot — non-blocking,
  // no-op if SupabaseDB not ready yet. After load, also paint the trial
  // chip in the topbar so it's visible globally without forcing a tour
  // through Settings.
  setTimeout(function() {
    if (typeof Subscription === 'undefined' || !Subscription.refreshFromCloud) return;
    Subscription.refreshFromCloud().then(function() {
      var chip = document.getElementById('bm-trial-chip');
      if (!chip || !Subscription.isTrial) return;
      var d = Subscription.daysLeftInTrial();
      if (Subscription.isTrial() && d != null && d > 0 && d <= 7) {
        // Free-for-now posture: show a calm countdown only while days remain.
        // No alarming "expired" state — billing is intentionally off, the app
        // keeps working indefinitely, so an expiry warning would be misleading.
        chip.style.display = 'inline-flex';
        chip.textContent = '⏳ Trial · ' + d + 'd left';
      } else {
        chip.style.display = 'none';
      }
    }).catch(function(){});
  }, 600);

  // Restore detail if we have one that matches the loaded page
  if (savedDetail && savedDetail.page === targetPage && savedDetail.id) {
    setTimeout(function() {
      try {
        if (savedDetail.page === 'quotes' && typeof QuotesPage !== 'undefined') QuotesPage.showDetail(savedDetail.id);
        else if (savedDetail.page === 'clients' && typeof ClientsPage !== 'undefined') ClientsPage.showDetail(savedDetail.id);
        else if (savedDetail.page === 'jobs' && typeof JobsPage !== 'undefined') JobsPage.showDetail(savedDetail.id);
        else if (savedDetail.page === 'invoices' && typeof InvoicesPage !== 'undefined') InvoicesPage.showDetail(savedDetail.id);
        else if (savedDetail.page === 'requests' && typeof RequestsPage !== 'undefined' && RequestsPage.showDetail) RequestsPage.showDetail(savedDetail.id);
      } catch(e) { console.warn('Detail restore failed:', e); }
    }, 250);
  }

  // Show compliance popup after a short delay so the page settles first
  setTimeout(function() {
    if (typeof Reminders !== 'undefined') Reminders.checkLoginPopup();
  }, 800);
}
} // end bmInit

// Boot wrapper: an email-confirmation return must be handled BEFORE the auth
// gate / page router run. handleEmailConfirmReturn establishes the session
// from the just-confirmed link, redeems the comp code, arms the welcome
// splash, then reloads into a clean authenticated boot — in which case we
// must NOT continue into bmInit (the reload restarts everything).
async function bmBoot() {

// ── Service Worker ──
if ('serviceWorker' in navigator) {
  // v1049: one-tap storage cleanup — visit /?cleanstorage=1 on a phone whose
  // localStorage filled up (QuotaExceededError). Frees the re-downloadable photo
  // blobs + disposable caches, KEEPS the login session and any pending uploads,
  // shows the top space-hogs (so we learn what actually filled it), then reloads.
  if (/[?&]cleanstorage=/.test(location.search)) {
    (function() {
      try {
        // 1. Measure every key (UTF-16 ≈ 2 bytes/char).
        var sizes = [];
        var total = 0;
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          var v = localStorage.getItem(k) || '';
          var bytes = (k.length + v.length) * 2;
          sizes.push({ key: k, bytes: bytes });
          total += bytes;
        }
        sizes.sort(function(a, b) { return b.bytes - a.bytes; });
        var kb = function(b) { return (b / 1024).toFixed(0) + 'KB'; };
        var top = sizes.slice(0, 6).map(function(s) { return s.key + ' = ' + kb(s.bytes); }).join('\n');

        // 2. Decide what to evict. Disposable = re-syncs from cloud or is temp.
        //    NEVER touch: auth session (sb-*-auth-token), pending write queue,
        //    tombstones, the core config. Everything else here is safe because
        //    Branch Manager is cloud-live (cloud is the source of truth).
        var KEEP = /^(sb-.*-auth-token$|bm-write-queue$|bm-tombstones$|bm-supabase-url$|bm-supabase-key$|bm-config$|bm-tenant)/;
        var DISPOSABLE = /^(bm-photos-|bm-ai-|bm-vq-|.*-recovery$|bm-plantnet|bm-blocked-fabricated$)/;
        var freed = 0, removedKeys = [];
        // snapshot keys first (removing during iteration reindexes)
        var allKeys = [];
        for (var j = 0; j < localStorage.length; j++) allKeys.push(localStorage.key(j));
        allKeys.forEach(function(key) {
          if (!key) return;
          if (KEEP.test(key)) return;
          if (DISPOSABLE.test(key)) {
            try { freed += (localStorage.getItem(key) || '').length * 2; localStorage.removeItem(key); removedKeys.push(key); } catch (e) {}
          }
        });

        alert('Storage before: ' + kb(total) + '\n\nBiggest items:\n' + top +
              '\n\nFreed: ' + kb(freed) + ' (' + removedKeys.length + ' items)\nPhotos re-download from the cloud. You stay logged in.\n\nReloading…');
        location.replace(location.pathname);
      } catch (e) { alert('Cleanup error: ' + e.message); location.replace(location.pathname); }
    })();
  }
  // Emergency reset: visit /?reset=1 to nuke SW + caches and reload clean
  else if (/[?&]reset=/.test(location.search)) {
    (async function() {
      try {
        var regs = await navigator.serviceWorker.getRegistrations();
        for (var i = 0; i < regs.length; i++) { await regs[i].unregister(); }
        var keys = await caches.keys();
        for (var j = 0; j < keys.length; j++) { await caches.delete(keys[j]); }
        alert('Cache cleared. Reloading…');
        location.replace(location.pathname);
      } catch(e) { alert('Reset error: ' + e.message); }
    })();
  } else {
    // updateViaCache:'none' tells the browser NEVER to HTTP-cache sw.js itself
    // (iOS PWA bug: without this, iOS holds the old sw.js for up to 24h and
    // updates never land even when reg.update() fires).
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function(reg) {
      // v667: reg.update() is async and rejects on transient sw.js fetch
      // failures (mid-deploy, CF cache miss). The try/catch wrappers only
      // caught sync throws, so rejections bubbled to onunhandledrejection
      // → Sentry. Wrap each .update() with a noop .catch — these are all
      // best-effort "update if you can" calls; silent failure is correct.
      var safeUpdate = function() {
        try { var p = reg.update(); if (p && p.catch) p.catch(function(){}); } catch(e) {}
      };
      // Check for SW update every time page loads
      safeUpdate();
      // Also re-check when the PWA comes back to foreground (iOS re-focus)
      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') safeUpdate();
      });
      // And every 15 minutes if the app stays open
      setInterval(safeUpdate, 15 * 60 * 1000);
      // If new SW waiting, activate it immediately
      if (reg.waiting) { reg.waiting.postMessage({ type: 'SKIP_WAITING' }); }
      reg.addEventListener('updatefound', function() {
        var newWorker = reg.installing;
        if (newWorker) {
          newWorker.addEventListener('statechange', function() {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              // New SW is ready. DON'T auto-reload — that was interrupting users
              // mid-task every 15 min during a deploy burst. Instead show a
              // small dismissable toast the user taps when they're ready.
              // If a form is open, queue a retry; otherwise prompt immediately.
              var showUpdatePrompt = function() {
                var hasOpenForm = !!(document.getElementById('inv-form') ||
                                      document.getElementById('quote-form') ||
                                      document.getElementById('client-form') ||
                                      document.getElementById('job-form') ||
                                      document.getElementById('req-form'));
                if (hasOpenForm) {
                  // User is typing — wait 2 min and ask again
                  setTimeout(showUpdatePrompt, 2 * 60 * 1000);
                  return;
                }
                if (document.getElementById('bm-update-toast')) return; // already showing
                var toast = document.createElement('div');
                toast.id = 'bm-update-toast';
                toast.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a3c12;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:99999;display:flex;gap:10px;align-items:center;font-size:14px;max-width:90vw;';
                toast.innerHTML = '<span>🎉 New Branch Manager version ready</span>' +
                  '<button id="bm-upd-now" style="background:#00836c;color:#fff;border:none;padding:6px 14px;border-radius:6px;font-weight:700;cursor:pointer;font-size:13px;">Refresh now</button>' +
                  '<button id="bm-upd-later" style="background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3);padding:6px 10px;border-radius:6px;cursor:pointer;font-size:12px;">Later</button>';
                document.body.appendChild(toast);
                document.getElementById('bm-upd-now').onclick = function() {
                  newWorker.postMessage({ type: 'SKIP_WAITING' });
                  setTimeout(function() { location.reload(); }, 300);
                };
                document.getElementById('bm-upd-later').onclick = function() {
                  toast.remove();
                  // Ask again in 30 min; otherwise user reloads whenever they want
                  setTimeout(showUpdatePrompt, 30 * 60 * 1000);
                };
              };
              showUpdatePrompt();
            }
          });
        }
      });
    }).catch(function(e) { console.log('SW:', e); });
  }
}

(function() {

document.addEventListener('keydown', function(e) {

  if (document.querySelector('.modal-overlay')) return;

  if (meta && e.key === 'k') { e.preventDefault(); if(typeof CommandPalette!=='undefined') CommandPalette.show(); else document.getElementById('globalSearch').focus(); }
  else if (meta && e.key === 'n') { e.preventDefault(); QuickCreate.show(); }

  else if (e.key === '2') { loadPage('schedule'); }
  else if (e.key === '3') { loadPage('clients'); }
  else if (e.key === '4') { loadPage('quotes'); }
  else if (e.key === '5') { loadPage('jobs'); }
  else if (e.key === '6') { loadPage('invoices'); }
  else if (e.key === '7') { loadPage('pipeline'); }
  else if (e.key === '8') { loadPage('dispatch'); }
  else if (e.key === '9') { loadPage('expenses'); }

      + row('Dashboard', '1') + row('Schedule', '2') + row('Clients', '3') + row('Quotes', '4')
      + row('Jobs', '5') + row('Invoices', '6') + row('Pipeline', '7') + row('Dispatch', '8')
      + row('Expenses', '9') + row('Settings', '0')
      + '</div><div>'
      + '<div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text-light);padding:8px 0 4px;border-bottom:1px solid var(--border);margin-bottom:4px;">Actions</div>'
      + row('Command Palette', '\u2318K') + row('Create New', '\u2318N') + row('Dark Mode', '\u2318D')
      + row('AI Assistant', '\u2318J') + row('Help', '?')
      + '<div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text-light);padding:12px 0 4px;border-bottom:1px solid var(--border);margin-bottom:4px;">Tips</div>'
      + '<div style="font-size:12px;color:var(--text-light);line-height:1.6;padding-top:4px;">Drag jobs onto the calendar to schedule them. Click column headers to sort tables. Use the command palette for quick access to any feature.</div>'
      + '</div></div>'
      + '</div>');
  }
});

<script>
/* ── Notification Center Dropdown ── */
var NotifCenter = (function() {
  var STORAGE_KEY = 'bm-notif-read';
  var _commCache = [];
  var _lastPollTime = null;
  var _browserAsked = false;

  function _requestBrowserPerms() {
    // v637: defensively check requestPermission EXISTS as a function before
    // calling. Some browsers/contexts (iOS Safari, certain mobile WebViews,
    // Android with notifications disabled) expose `Notification` but not
    // `Notification.requestPermission`. Sentry caught a TypeError on Chrome
    // 142 / Windows from the bare call.
    if (_browserAsked || !('Notification' in window)) return;
    if (typeof Notification.requestPermission !== 'function') { _browserAsked = true; return; }
    if (Notification.permission !== 'default') return;
    _browserAsked = true;
    try { var p = Notification.requestPermission(); if (p && typeof p.catch === 'function') p.catch(function(){}); } catch(e) {}
  }

  function _fireBrowserNotif(title, body) {
    if (!('Notification' in window) || typeof Notification === 'undefined') return;
    if (Notification.permission !== 'granted') return;
    try { new Notification(title, { body: body, icon: '/favicon-32x32.png', tag: 'bm-comms' }); } catch(e) {}
  }

  function _updateCCDot() {
    var dot = document.getElementById('cc-indicator-dot');
    if (!dot) return;
    var readIds = getReadIds();
    var unread = _commCache.filter(function(c) { return readIds.indexOf('comm-' + c.id) < 0; }).length;
    if (unread > 0) { dot.className = 'cc-dot active'; }
    else { dot.className = 'cc-dot'; }
  }

  // v726: missed calls deliberately excluded — Doug doesn't want them in
  // the system. Voicemails (transcripts) and SMS still come through.
  // Edge function (dialpad-webhook) drops new ones at ingest; this filter
  // is defense-in-depth for any historical rows already in the table.
  function _isMissedCallRow(c) {
    if (!c || c.channel !== 'call') return false;
    // Only a genuinely answered/connected call is real activity. Everything
    // else — ringing, missed, no-answer, hangup, blank — is a missed call and
    // must never appear in the feed (Doug's standing rule). Dialpad logs each
    // inbound ring as status 'ringing', which the old missed-set didn't catch,
    // so the whole feed filled with "Missed call".
    var s = (c.status || '').toLowerCase();
    return s !== 'completed' && s !== 'answered' && s !== 'connected';
  }

  function _loadComms() {
    var sb = (typeof SupabaseDB !== 'undefined') ? SupabaseDB.client : null;
    if (!sb) return;
    var since = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString();
    sb.from('communications')
      .select('id,channel,direction,from_number,body,status,created_at,metadata')
      .gte('created_at', since)
      .eq('direction', 'inbound')
      .order('created_at', { ascending: false })
      .limit(50)
      .then(function(r) {
        if (r.error || !r.data) return;
        // v726: drop missed calls before they hit cache, browser notif, or feed
        var rows = r.data.filter(function(c) { return !_isMissedCallRow(c); });
        // Fire browser notifications for genuinely new items
        if (_lastPollTime) {
          var newItems = rows.filter(function(c) { return c.created_at > _lastPollTime; });
          newItems.forEach(function(c) {
            var meta = c.metadata && typeof c.metadata === 'object' ? c.metadata : {};
            var name = meta.name || c.from_number || 'Unknown';
            var label = c.channel === 'sms' ? 'SMS from ' : (c.channel === 'voicemail' ? 'Voicemail from ' : 'Inbound from ');
            var snippet = c.body ? ' — ' + c.body.substring(0, 60) : '';
            _fireBrowserNotif('Branch Manager', label + name + snippet);
          });
        }
        _commCache = rows;
        _lastPollTime = new Date().toISOString();
        _updateCCDot();
        updateBadge();
      });
  }

  function markCommsRead() {
    var readIds = getReadIds();
    _commCache.forEach(function(c) {
      var id = 'comm-' + c.id;
      if (readIds.indexOf(id) < 0) readIds.push(id);
    });
    setReadIds(readIds);
    _updateCCDot();
    updateBadge();
  }

  function getReadIds() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch(e) { return []; }
  }

  function setReadIds(ids) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(ids)); } catch(e) {}
  }

  function timeAgo(dateStr) {
    if (!dateStr) return '';
    var now = new Date();
    var then = new Date(dateStr);
    var diff = Math.floor((now - then) / 1000);
    if (diff < 60) return 'just now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
    return Math.floor(diff / 604800) + 'w ago';
  }

  function getClientName(clientId) {
    if (!clientId || typeof DB === 'undefined') return 'Unknown';
    var client = DB.clients.getById(clientId);
    return client ? (client.name || client.firstName + ' ' + (client.lastName || '')) : 'Unknown';
  }

  // v730: per-category visibility (Customize Feed). Persists to
  // bm-feed-categories. Default: all enabled. Used to filter what
  // buildNotifications surfaces to the panel.
  var _feedCatDefs = [
    { key: 'requests', label: 'Requests' },
    { key: 'quotes',   label: 'Quotes' },
    { key: 'jobs',     label: 'Jobs' },
    { key: 'invoices', label: 'Invoices' },
    { key: 'payments', label: 'Payments' },
    { key: 'tasks',    label: 'Tasks' },
    { key: 'comms',    label: 'SMS / Voicemail' }
  ];
  function _feedCats() {
    var raw;
    try { raw = JSON.parse(localStorage.getItem('bm-feed-categories') || '{}'); }
    catch (e) { raw = {}; }
    var out = {};
    _feedCatDefs.forEach(function(d) { out[d.key] = raw[d.key] !== false; });
    return out;
  }
  function _setFeedCat(key, val) {
    var cats = _feedCats();
    cats[key] = !!val;
    try { localStorage.setItem('bm-feed-categories', JSON.stringify(cats)); } catch(e) {}
  }

  // v730/v731: panel has two views — 'feed' (default) and 'settings'.
  // Gear button on the feed header → settings; back arrow → feed.
  var _panelView = 'feed';

  function _renderSettingsBody() {
    var cats = _feedCats();
    var rows = _feedCatDefs.map(function(d) {
      var on = cats[d.key] !== false;
      return '<label style="display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--border);cursor:pointer;">'
        +   '<span style="font-size:14px;color:var(--text);font-weight:500;">' + d.label + '</span>'
        +   '<input type="checkbox" ' + (on ? 'checked' : '') + ' onchange="NotifCenter.setCat(\'' + d.key + '\', this.checked)" style="width:36px;height:20px;cursor:pointer;accent-color:var(--green-dark);">'
        + '</label>';
    }).join('');
    var support = '<div style="padding:18px 24px;border-top:6px solid var(--bg);">'
      +   '<div style="font-size:11px;font-weight:700;color:var(--text-light);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;">Support</div>'
      +   '<button onclick="NotifCenter.close();loadPage(\'help\');" style="display:block;width:100%;text-align:left;padding:12px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;font-size:14px;font-weight:600;color:var(--text);cursor:pointer;margin-bottom:8px;">📖 Help &amp; onboarding</button>'
      +   '<a href="mailto:support@branchmanager.app?subject=BM%20support%20request" style="display:block;padding:12px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;font-size:14px;font-weight:600;color:var(--text);text-decoration:none;margin-bottom:8px;">✉ Email support</a>'
      +   '<button onclick="NotifCenter.close();loadPage(\'settings\');" style="display:block;width:100%;text-align:left;padding:12px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;font-size:14px;font-weight:600;color:var(--text);cursor:pointer;">⚙ Open Settings</button>'
      + '</div>';
    return '<div style="overflow-y:auto;flex:1;">'
      +   '<div style="padding:14px 24px;font-size:13px;color:var(--text-light);line-height:1.5;">Toggle which categories appear in the Activity Feed. Choices persist on this device.</div>'
      +   rows
      +   support
      + '</div>';
  }

  // v724: Activity Feed builder — clean entries with bold action +
  // amount, sub-line (ref # · description), client name, timestamp.
  // Each entry now includes `cat` for per-category filtering.
  function buildNotifications() {
    if (typeof DB === 'undefined') return [];
    var items = [];
    var now = new Date();
    var sevenDaysAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000).toISOString();
    var moneyFn = (typeof UI !== 'undefined' && UI.moneyInt) ? UI.moneyInt : function(n){ return '$' + (n||0); };

    // Accuracy guards — same idea as v720 dashboard inbox. Don't surface
    // events for clients whose work has obviously moved on (job exists
    // for a "quote sent" event, paid invoice for an "approved" event).
    var clientHasJob = {};
    var clientHasPaid = {};
    DB.jobs.getAll().forEach(function(j) { if (j.clientId) clientHasJob[j.clientId] = 1; });
    DB.invoices.getAll().forEach(function(i) {
      if (!i.clientId) return;
      var paid = (i.status === 'paid') || i.paidAt || i.paidDate || (typeof i.balance === 'number' && i.balance <= 0);
      if (paid) clientHasPaid[i.clientId] = 1;
    });

    // New requests (last 7 days)
    DB.requests.getAll().forEach(function(r) {
      if (!r.createdAt || r.createdAt < sevenDaysAgo) return;
      var who = getClientName(r.clientId || r.client);
      items.push({
        id: 'req-' + r.id, icon: '📥', iconBg: '#e8f5e9', cat: 'requests',
        title: 'New request',
        sub: r.property || r.notes || r.service || '',
        client: who,
        time: r.createdAt, page: 'requests', recordId: r.id
      });
    });

    // v725: Surface quote events on their ACTUAL event timestamp
    // (sentAt for sent, approvedAt for approved, declinedAt for declined),
    // NOT q.updatedAt — which gets bumped by CloudSync pulls / imports
    // and was making old quotes look like recent sends. The Supabase
    // communications table is the source of truth for what actually
    // went out; this feed should match that timeline.
    DB.quotes.getAll().forEach(function(q) {
      var num = q.quoteNumber || q.id.substring(0, 6);
      var amt = q.total ? ' — ' + moneyFn(q.total) : '';
      var desc = q.description || '';
      var who = getClientName(q.clientId || q.client);
      // SENT — only when sentAt itself is recent
      if (q.status === 'sent' && !clientHasJob[q.clientId] && q.sentAt && q.sentAt >= sevenDaysAgo) {
        items.push({ id: 'qsent-' + q.id, icon: '📤', iconBg: '#e3f2fd', cat: 'quotes',
          title: 'Quote sent' + amt,
          sub: 'Quote #' + num + (desc ? ' · ' + desc : ''),
          client: who, time: q.sentAt, page: 'quotes', recordId: q.id });
      }
      // APPROVED — use approvedAt
      if (q.status === 'approved' && !clientHasPaid[q.clientId] && q.approvedAt && q.approvedAt >= sevenDaysAgo) {
        items.push({ id: 'qappr-' + q.id, icon: '✅', iconBg: '#e8f5e9', cat: 'quotes',
          title: 'Quote approved' + amt,
          sub: 'Quote #' + num + (desc ? ' · ' + desc : ''),
          client: who, time: q.approvedAt, page: 'quotes', recordId: q.id });
      }
      // CHANGES REQUESTED / AWAITING — these don't have a dedicated event
      // timestamp; updatedAt is acceptable because the status itself
      // implies the change.
      if ((q.status === 'awaiting' || q.status === 'changes_requested') && q.updatedAt && q.updatedAt >= sevenDaysAgo) {
        items.push({ id: 'qchg-' + q.id, icon: '💬', iconBg: '#fff3e0', cat: 'quotes',
          title: 'Client requested changes',
          sub: 'Quote #' + num + (desc ? ' · ' + desc : ''),
          client: who, time: q.updatedAt, page: 'quotes', recordId: q.id });
      }
      // DECLINED — use declinedAt
      if (q.status === 'declined' && q.declinedAt && q.declinedAt >= sevenDaysAgo) {
        items.push({ id: 'qdec-' + q.id, icon: '✗', iconBg: '#fce4ec', cat: 'quotes',
          title: 'Quote declined' + amt,
          sub: 'Quote #' + num + (desc ? ' · ' + desc : ''),
          client: who, time: q.declinedAt, page: 'quotes', recordId: q.id });
      }
    });

    // Jobs completed (last 7 days)
    DB.jobs.getAll().forEach(function(j) {
      if (j.status !== 'completed') return;
      var ts = j.completedAt || j.completedDate || j.updatedAt || j.scheduledDate;
      if (!ts || ts < sevenDaysAgo) return;
      var num = j.jobNumber || j.id.substring(0, 6);
      var amt = j.total ? ' — ' + moneyFn(j.total) : '';
      items.push({ id: 'jdone-' + j.id, icon: '🌳', iconBg: '#fff3e0', cat: 'jobs',
        title: 'Job completed' + amt,
        sub: 'Job #' + num + (j.description ? ' · ' + j.description : ''),
        client: getClientName(j.clientId || j.client),
        time: ts, page: 'jobs', recordId: j.id });
    });

    // Invoices — paid (last 7 days) + past due (always)
    DB.invoices.getAll().forEach(function(inv) {
      var num = inv.invoiceNumber || inv.id.substring(0, 6);
      var amt = inv.total ? ' — ' + moneyFn(inv.total) : '';
      var who = getClientName(inv.clientId || inv.client);
      var paidTs = inv.paidDate || inv.paidAt;
      if (inv.status === 'paid' && paidTs && paidTs >= sevenDaysAgo) {
        items.push({ id: 'ipaid-' + inv.id, icon: '💰', iconBg: '#e8f5e9', cat: 'payments',
          title: 'Payment received' + amt,
          sub: 'Invoice #' + num,
          client: who, time: paidTs, page: 'invoices', recordId: inv.id });
      }
      // Past-due: only if not paid AND no clientHasPaid flag (client may have
      // paid via another invoice / off-system). Avoids duplicate noise.
      if (inv.status !== 'paid' && inv.status !== 'draft' && inv.status !== 'cancelled' && inv.dueDate) {
        var due = new Date(inv.dueDate);
        if (due < now && !clientHasPaid[inv.clientId]) {
          var bal = (typeof inv.balance === 'number') ? inv.balance : inv.total;
          items.push({ id: 'idue-' + inv.id, icon: '⚠', iconBg: '#fce4ec', cat: 'invoices',
            title: 'Invoice past due — ' + moneyFn(bal),
            sub: 'Invoice #' + num,
            client: who, time: inv.dueDate, page: 'invoices', recordId: inv.id });
        }
      }
    });

    // v731: overdue / due-today tasks surface as feed items so they show
    // up alongside other "needs your attention" events. Filtered by the
    // 'tasks' cat toggle.
    if (typeof TaskReminders !== 'undefined' && TaskReminders._getAll) {
      var todayStart = new Date(); todayStart.setHours(0, 0, 0, 0);
      var todayEnd = new Date(); todayEnd.setHours(23, 59, 59, 999);
      TaskReminders._getAll().forEach(function(t) {
        if (t.completed || t.archived || !t.dueDate) return;
        var due = new Date(t.dueDate);
        if (isNaN(due)) return;
        if (due < todayStart) {
          var daysOver = Math.floor((Date.now() - due.getTime()) / 86400000);
          items.push({
            id: 'tover-' + t.id, icon: '⏰', iconBg: '#fee2e2', cat: 'tasks',
            title: 'Task overdue (' + daysOver + 'd)',
            sub: t.title || '', client: '',
            time: t.dueDate, page: 'taskreminders', recordId: t.id
          });
        } else if (due <= todayEnd) {
          items.push({
            id: 'ttoday-' + t.id, icon: '⏰', iconBg: '#fff3e0', cat: 'tasks',
            title: 'Task due today',
            sub: t.title || '', client: '',
            time: t.dueDate, page: 'taskreminders', recordId: t.id
          });
        }
      });
    }

    // Inbound communications (SMS / voicemails from Dialpad — missed
    // calls already filtered upstream by v726 _isMissedCallRow).
    _commCache.forEach(function(c) {
      var meta = c.metadata && typeof c.metadata === 'object' ? c.metadata : {};
      var cName = meta.name || c.from_number || 'Unknown';
      var cIcon = c.channel === 'sms' ? '💬' : (c.channel === 'voicemail' ? '📭' : '📵');
      var cBg   = c.channel === 'sms' ? '#e3f2fd' : '#fce4ec';
      var cTitle = c.channel === 'sms' ? 'SMS received' : (c.channel === 'voicemail' ? 'Voicemail' : 'Missed call');
      items.push({
        id: 'comm-' + c.id, icon: cIcon, iconBg: cBg, cat: 'comms',
        title: cTitle,
        sub: meta.service_wanted ? meta.service_wanted.substring(0, 60) : (c.body ? c.body.substring(0, 60) : ''),
        client: cName,
        time: c.created_at, page: 'callcenter', recordId: c.id
      });
    });

    // v730/v731: filter by per-category visibility before sorting.
    var cats = _feedCats();
    items = items.filter(function(it) {
      if (!it.cat) return true; // unknown category: always show
      return cats[it.cat] !== false;
    });
    items.sort(function(a, b) { return (b.time || '').localeCompare(a.time || ''); });
    return items.slice(0, 30);
  }

  function render() {
    var dropdown = document.getElementById('notif-dropdown');
    if (!dropdown) return;

    var items = buildNotifications();
    var readIds = getReadIds();

    // v731: panel has two views — feed (default) and settings (customize
    // categories). Header swaps title + actions based on _panelView.
    var html;
    if (_panelView === 'settings') {
      html = '<div class="notif-dropdown-header">'
        + '<button class="notif-close-btn" onclick="NotifCenter.showFeed()" title="Back" style="font-size:20px;">&larr;</button>'
        + '<h3 style="flex:1;text-align:center;margin:0 8px;">Customize Feed</h3>'
        + '<button class="notif-close-btn" onclick="NotifCenter.close()" title="Close">&times;</button>'
        + '</div>'
        + _renderSettingsBody();
      dropdown.innerHTML = html;
      return;
    }
    var html = '<div class="notif-dropdown-header">'
      + '<h3>Activity Feed</h3>'
      + '<div style="display:flex;align-items:center;gap:4px;">'
      +   '<button class="notif-close-btn" onclick="NotifCenter.showSettings()" title="Customize feed">⚙</button>'
      +   '<button class="notif-close-btn" onclick="NotifCenter.close()" title="Close">&times;</button>'
      + '</div>'
      + '</div>'
      + '<div style="padding:10px 24px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">'
      +   '<span style="font-size:12px;color:var(--text-light);">Last 7 days</span>'
      +   '<a onclick="NotifCenter.markAllRead()" style="font-size:13px;color:var(--accent);cursor:pointer;font-weight:600;">Mark all read</a>'
      + '</div>';

    html += '<div class="notif-dropdown-list">';
    if (items.length === 0) {
      html += '<div class="notif-dropdown-empty">No recent activity</div>';
    } else {
      for (var i = 0; i < items.length; i++) {
        var item = items[i];
        var isRead = readIds.indexOf(item.id) >= 0;
        var safePage = String(item.page || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        var safeRecordId = String(item.recordId || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        var safeId = String(item.id || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        // v724: clean row — bold title (action + amount), thin
        // sub-line (ref# + description), even thinner client line, time
        // right-aligned at top.
        var esc = function(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };
        html += '<div class="notif-dropdown-item' + (isRead ? '' : ' unread') + '" onclick="NotifCenter.clickItem(\'' + safePage + '\',\'' + safeRecordId + '\',\'' + safeId + '\')">'
          + '<div class="notif-dropdown-icon" style="background:' + item.iconBg + ';">' + item.icon + '</div>'
          + '<div class="notif-dropdown-body">'
          +   '<div class="notif-row-top">'
          +     '<p class="notif-dropdown-title">' + esc(item.title || item.msg || '') + '</p>'
          +     '<p class="notif-dropdown-time">' + timeAgo(item.time) + '</p>'
          +   '</div>'
          +   (item.sub    ? '<p class="notif-dropdown-sub">'    + esc(item.sub)    + '</p>' : '')
          +   (item.client ? '<p class="notif-dropdown-client">' + esc(item.client) + '</p>' : '')
          + '</div>'
          + (isRead ? '' : '<div class="notif-dropdown-dot"></div>')
          + '</div>';
      }
    }
    html += '</div>';

    html += '<div class="notif-dropdown-footer">'
      + '<a onclick="NotifCenter.close();loadPage(\'notifications\');">View all activity &rarr;</a>'
      + '</div>';

    dropdown.innerHTML = html;
  }

  function updateBadge() {
    var badge = document.getElementById('notif-badge');
    if (!badge) return;
    var items = buildNotifications();
    var readIds = getReadIds();
    var unread = 0;
    for (var i = 0; i < items.length; i++) {
      if (readIds.indexOf(items[i].id) < 0) unread++;
    }
    if (unread > 0) {
      badge.textContent = unread > 99 ? '99+' : unread;
      badge.className = 'notif-badge active';
    } else {
      badge.textContent = '';
      badge.className = 'notif-badge';
    }
  }

  function toggle(e) {
    if (e) { e.stopPropagation(); e.preventDefault(); }
    var dropdown = document.getElementById('notif-dropdown');
    if (!dropdown) return;
    var isOpen = dropdown.classList.contains('open');
    if (isOpen) {
      close();
    } else {
      _panelView = 'feed'; // v731: always start on feed view when reopening
      render();
      dropdown.classList.add('open');
      var backdrop = document.getElementById('notif-backdrop');
      if (backdrop) backdrop.classList.add('open');
    }
  }

  function close() {
    var dropdown = document.getElementById('notif-dropdown');
    if (dropdown) dropdown.classList.remove('open');
    var backdrop = document.getElementById('notif-backdrop');
    if (backdrop) backdrop.classList.remove('open');
  }

  function clickItem(page, recordId, notifId) {
    // Mark as read
    var readIds = getReadIds();
    if (readIds.indexOf(notifId) < 0) {
      readIds.push(notifId);
      setReadIds(readIds);
    }
    close();
    updateBadge();
    // Navigate to page
    if (typeof loadPage === 'function') {
      loadPage(page);
    }
  }

  function markAllRead() {
    var items = buildNotifications();
    var readIds = getReadIds();
    for (var i = 0; i < items.length; i++) {
      if (readIds.indexOf(items[i].id) < 0) {
        readIds.push(items[i].id);
      }
    }
    setReadIds(readIds);
    render();
    updateBadge();
    if (typeof UI !== 'undefined' && UI.toast) UI.toast('All notifications marked as read');
  }

  // Close on outside click
  document.addEventListener('click', function(e) {
    var dropdown = document.getElementById('notif-dropdown');
    var bell = document.getElementById('notif-bell-btn');
    if (!dropdown || !dropdown.classList.contains('open')) return;
    if (!dropdown.contains(e.target) && (!bell || !bell.contains(e.target))) {
      close();
    }
  });

  // Update badge periodically + poll communications
  function init() {
    updateBadge();
    setInterval(updateBadge, 60000);
    // Start communications polling (delayed to let SupabaseDB initialize)
    setTimeout(function() {
      _requestBrowserPerms();
      _loadComms();
      setInterval(_loadComms, 30000);
    }, 4000);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    setTimeout(init, 500);
  }

  // v731/v732: customize-feed view switching + per-category toggle setter
  function showSettings() { _panelView = 'settings'; render(); }
  function showFeed()     { _panelView = 'feed';     render(); }
  function setCat(key, val) {
    _setFeedCat(key, val);
    // v732: bell badge should reflect what's actually surfaced — refresh
    // it immediately when a category flips so the count matches the feed.
    updateBadge();
  }

  // v732: Esc closes the panel from anywhere; nice-to-have for kbd users
  // (the bell click + outside click + × already worked).
  document.addEventListener('keydown', function(e) {
    if (e.key !== 'Escape') return;
    var dd = document.getElementById('notif-dropdown');
    if (dd && dd.classList.contains('open')) close();
  });

  return {
    toggle: toggle,
    close: close,
    clickItem: clickItem,
    markAllRead: markAllRead,
    updateBadge: updateBadge,
    markCommsRead: markCommsRead,
    refreshComms: _loadComms,
    showSettings: showSettings,
    showFeed: showFeed,
    setCat: setCat
  };
})();
</script>
<script>
// Daily automations — runs once per day in background
document.addEventListener('DOMContentLoaded', function() {
  setTimeout(function() {
    if (typeof AutomationsPage !== 'undefined' && AutomationsPage.init) {
      AutomationsPage.init();
      if (AutomationsPage.startApprovalPolling) AutomationsPage.startApprovalPolling();
    }
    if (typeof SupabaseDB !== 'undefined' && SupabaseDB.startRequestPolling) {
      SupabaseDB.startRequestPolling();
    }
    // Auto-mark overdue invoices and fix invalid job statuses on every app load
    if (typeof DB !== 'undefined') {
      if (DB.invoices && DB.invoices.markOverdue) DB.invoices.markOverdue();
      if (DB.jobs && DB.jobs.fixStatuses) DB.jobs.fixStatuses();
    }
    // Start session timeout timer (auto-logout after 30 days inactivity)
    if (typeof Auth !== 'undefined' && Auth.startSessionTimer) Auth.startSessionTimer();
    // Biometric gate — if user has enabled Face ID / Touch ID, show lock screen now
    if (typeof Biometric !== 'undefined' && Biometric.initGate) Biometric.initGate();
    // Check for auto review requests
    if (typeof ReviewsPage !== 'undefined' && ReviewsPage.checkAutoReviews) ReviewsPage.checkAutoReviews();
    // Initialize TeamChat real-time subscription
    if (typeof TeamChat !== 'undefined' && TeamChat._init) TeamChat._init();
    // v684: prefetch weather + paint topbar chip even if user hasn't enabled

// v630: on full reload (F5 / Cmd+R / Cmd+Shift+R) always land on dashboard,
// even if the URL still carries a deep hash. Pull-to-refresh on PWA does the
// same. Direct navigation (clicking a link, opening a bookmark with a hash,
// or browser back) still honors the hash.
(function() {
  var nav = (performance.getEntriesByType && performance.getEntriesByType('navigation')[0]) || null;
  var isReload = nav && nav.type === 'reload';
  if (isReload) {
    // Strip the hash so subsequent navigation doesn't bounce back via popstate
    if (window.location.hash) {
      try { history.replaceState({ page: 'dashboard' }, '', window.location.pathname + window.location.search); } catch(e){}
    }
    if (typeof loadPage === 'function') setTimeout(function() { loadPage('dashboard'); }, 100);
    return;
  }
  // Fresh nav — honor the URL hash (deep link / bookmark / external open).
  if (window.location.hash && window.location.hash.length > 1) {
    var hashPage = window.location.hash.slice(1);
    // v656: legacy #marketing folds into SocialBranch's leads tab.
    if (hashPage === 'marketing') {
      hashPage = 'socialbranch';
      if (typeof SocialBranch !== 'undefined') SocialBranch._tab = 'leads';
    }
    if (typeof loadPage === 'function' && typeof pageRenderers !== 'undefined' && pageRenderers[hashPage]) {
      setTimeout(function() { loadPage(hashPage); }, 100);
    }
  }
})();

<script>
// Record deep-link: ?rec=quote-<id> / ?rec=job-<id> / ?rec=client-<id> / ?rec=invoice-<id>
// Lets external pages (today one-pager, run schedule) link straight to a record.
// Fully defensive: wrapped in try/catch, capped retry, never blocks boot. The
// link also carries a #quotes/#jobs hash, so the list still opens as a fallback
// even if the specific-record open can't run. Reuses the app's own _pendingDetail
// path (same mechanism the dashboard cards use).
(function(){
  try {
    var rec = new URLSearchParams(location.search).get('rec');
    if (!rec) return;
    var m = /^(quote|job|client|invoice)-(.+)$/.exec(rec);
    if (!m) return;
    var MAP = { quote:['quotes','QuotesPage'], job:['jobs','JobsPage'], client:['clients','ClientsPage'], invoice:['invoices','InvoicesPage'] };
    var t = MAP[m[1]]; if (!t) return;
    var id = m[2], page = t[0], objName = t[1], tries = 0;
    var iv = setInterval(function(){
      tries++;
      if (tries > 40) { clearInterval(iv); return; } // ~20s cap
      try {
        var P = window[objName];
        if (typeof loadPage !== 'function' || !P || !P.showDetail) return; // wait for bundle/auth
        clearInterval(iv);
        try { P._pendingDetail = id; } catch(e){}
        loadPage(page);
        // Fallback for pages that don't consume _pendingDetail on render:
        setTimeout(function(){ try { if (P._pendingDetail === id) { P._pendingDetail = null; P.showDetail(id); } } catch(e){} }, 700);
      } catch(e){}
    }, 500);
  } catch(e){}
})();
</script>

<script>
/* COMPAT SHIM (index-only, no bundle rebuild) — supabase-js v2 query builder is a
   thenable (.then) but has NO .catch/.finally. Any supabase.from(x).insert(y).catch(fn)
   in the bundle throws "catch is not a function" SYNCHRONOUSLY, aborting the surrounding
   save pipeline -> silent data loss (deleted invoice #1003, Jul 15). Verified fix vs the
   real lib in headless Chrome. Patches the builder prototype once at boot. */
(function(){var tries=0;var iv=setInterval(function(){tries++;try{
  var lib=window.supabase;
  if(!lib||typeof lib.createClient!=='function'){ if(tries>160)clearInterval(iv); return; }
  var tmp=lib.createClient('https://shim.placeholder.co','placeholder-anon-key');
  var b=tmp.from('_shim_probe_').select('id'); var p=b;
  while(p && !Object.prototype.hasOwnProperty.call(p,'then')) p=Object.getPrototypeOf(p);
  if(p && typeof p.then==='function'){
    if(typeof p.catch!=='function'){ p.catch=function(onRej){ return this.then(undefined,onRej); }; }
    if(typeof p.finally!=='function'){ p.finally=function(cb){ return this.then(
      function(v){ return Promise.resolve(cb&&cb()).then(function(){ return v; }); },
      function(e){ return Promise.resolve(cb&&cb()).then(function(){ throw e; }); }); }; }
    try{ console.log('[BM] supabase builder .catch/.finally shim installed'); }catch(_){}
  }
  clearInterval(iv);
}catch(e){ if(tries>160)clearInterval(iv); }},200);})();
</script>
