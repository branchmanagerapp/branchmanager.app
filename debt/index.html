<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Private</title>
<style>
  :root{--green:#2e7d32;--green-d:#10401a;--green-l:#e8f5e9;--ink:#16201a;--muted:#5f6b62;--line:#e2e8e2;--bg:#f5f8f5;--blue:#1a73e8;--red:#b0413b;--gold:#9a7b1e;--amber:#b9770f}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6}
  .wrap{max-width:780px;margin:0 auto;padding:0 20px}
  header{background:linear-gradient(160deg,#0c3012,#2e7d32 90%);color:#fff;padding:46px 0 38px;text-align:center}
  .kicker{letter-spacing:3px;font-size:12px;font-weight:800;text-transform:uppercase;opacity:.85;margin-bottom:8px}
  header h1{margin:0 auto;font-size:29px;line-height:1.18;font-weight:800;max-width:560px}
  header .tag{margin:13px auto 0;font-size:16px;opacity:.96;max-width:540px}
  section{margin:30px 0}
  h2{font-size:22px;margin:0 0 6px;color:var(--green-d)}
  .sub{color:var(--muted);margin:0 0 16px;font-size:15px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin:14px 0;box-shadow:0 1px 3px rgba(20,40,20,.04)}
  .lead{font-size:17px}.muted{color:var(--muted)}
  p{margin:0 0 12px}
  ul{margin:0 0 12px;padding-left:20px}li{margin:6px 0}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:620px){.two{grid-template-columns:1fr}}
  .does{background:#fff;border:1px solid #c8e6c9;border-radius:14px;padding:18px 20px}
  .does h3{margin:0 0 8px;color:var(--green-d);font-size:16px}
  .doesnt{background:#fff;border:1px solid #f0d2cf;border-radius:14px;padding:18px 20px}
  .doesnt h3{margin:0 0 8px;color:var(--red);font-size:16px}
  .does li::marker{content:"✓  ";color:var(--green);font-weight:800}
  .doesnt li::marker{content:"✕  ";color:var(--red);font-weight:800}
  .path{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0}
  .path .n{flex:0 0 34px;width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
  .path h3{margin:1px 0 4px;font-size:16.5px;color:var(--green-d)}
  .path .risk{font-size:13px;font-weight:700;margin-top:6px}
  .risk.lo{color:var(--green)}.risk.md{color:var(--amber)}.risk.hi{color:var(--red)}
  .flag{background:#fff8ec;border:1px solid #f0d9a8;border-left:4px solid var(--amber);border-radius:10px;padding:14px 16px;margin:14px 0;font-size:14.5px}
  .flag b{color:var(--amber)}
  .timeline{border-left:2px solid #cfe0cf;margin:8px 0 8px 8px;padding-left:0}
  .tl{display:flex;gap:14px;align-items:flex-start;position:relative;padding:8px 0 8px 18px}
  .tl::before{content:"";position:absolute;left:-7px;top:14px;width:12px;height:12px;border-radius:50%;background:var(--green);border:2px solid #fff}
  .tl .yr{flex:0 0 52px;font-weight:800;color:var(--green-d);font-size:15px;padding-top:1px}
  .tl .ev{font-size:14.5px}
  .tool{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;box-shadow:0 1px 3px rgba(20,40,20,.04)}
  .field{margin:12px 0}
  .field label{display:block;font-size:13.5px;font-weight:700;margin-bottom:5px}
  .field .ip{display:flex;align-items:center;gap:8px}
  .field .ip span{color:var(--muted);font-weight:700}
  .field input{width:170px;padding:10px 11px;border:1px solid var(--line);border-radius:9px;font-size:15px}
  .totals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 4px}
  .tot{background:#f7faf7;border:1px solid var(--line);border-radius:11px;padding:14px;text-align:center}
  .tot b{display:block;font-size:22px;color:var(--green-d)}.tot span{font-size:12px;color:var(--muted)}
  .verdict{margin-top:14px;padding:14px 16px;border-radius:11px;font-size:15px;font-weight:600;text-align:center}
  .verdict.ok{background:var(--green-l);color:var(--green-d);border:1px solid #c8e6c9}
  .verdict.warn{background:#fdecea;color:var(--red);border:1px solid #f0d2cf}
  .disc{background:#eef3f7;border:1px solid #d4e0ea;border-radius:12px;padding:16px 18px;font-size:13.5px;color:#3a4a59;margin-top:8px}
  footer{color:var(--muted);font-size:13px;text-align:center;padding:30px 0 50px}
  /* Lock screen */
  #lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .lockbox{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 30px rgba(16,64,26,.10);max-width:380px;width:100%;padding:34px 30px;text-align:center}
  .lockbox .ic{font-size:34px}
  .lockbox h1{font-size:20px;color:var(--green-d);margin:10px 0 4px}
  .lockbox p{font-size:14px;color:var(--muted);margin:0 0 18px}
  .lockbox input{width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:11px;font-size:16px;text-align:center}
  .lockbox button{width:100%;margin-top:12px;padding:13px;background:var(--green);color:#fff;border:none;border-radius:11px;font-size:16px;font-weight:800;cursor:pointer}
  .lockbox button:hover{background:var(--green-d)}
  .lockerr{display:none;margin-top:12px;font-size:13.5px;color:var(--red);font-weight:600}
  #content{display:none}
</style>
</head>
<body>

<div id="lock">
  <form class="lockbox" onsubmit="unlock(event)">
    <div class="ic">🔒</div>
    <h1>Private page</h1>
    <p>Enter the password Doug gave you.</p>
    <input id="pw" type="password" autocomplete="off" autofocus placeholder="Password">
    <button type="submit" id="unlockBtn">Unlock</button>
    <div class="lockerr" id="lockerr">That password didn't work. Try again.</div>
  </form>
</div>

function b64ToBytes(b){ return Uint8Array.from(atob(b), function(c){ return c.charCodeAt(0); }); }

async function unlock(e){
  e.preventDefault();
  var pw = document.getElementById('pw').value;
  var err = document.getElementById('lockerr');
  var btn = document.getElementById('unlockBtn');
  err.style.display='none';
  if(!window.__DEBT_BLOB__){ err.textContent='This page has no content yet — Doug needs to lock it first.'; err.style.display='block'; return; }
  btn.textContent='Unlocking…'; btn.disabled=true;
  try{
    var blob = JSON.parse(window.__DEBT_BLOB__);
    var salt = b64ToBytes(blob.s), iv = b64ToBytes(blob.iv), ct = b64ToBytes(blob.ct);
    var enc = new TextEncoder();
    var baseKey = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt:salt, iterations:250000, hash:'SHA-256' },
      baseKey, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    var ptBuf = await crypto.subtle.decrypt({ name:'AES-GCM', iv:iv }, key, ct);
    var html = new TextDecoder().decode(ptBuf);
    document.getElementById('content').innerHTML = html;
    document.getElementById('lock').style.display='none';
    document.getElementById('content').style.display='block';
    wireCalc();
    window.scrollTo(0,0);
  }catch(ex){
    err.textContent='That password didn’t work. Try again.';
    err.style.display='block';
    btn.textContent='Unlock'; btn.disabled=false;
  }
}

// Calculator — defined here (not in the encrypted markup) so it runs after the
// content is injected. innerHTML never executes <script>, so the logic must live
// in the always-present page shell.
function fmt(n){ return '$' + Math.round(n).toLocaleString(); }
function calc(){
  var t=document.getElementById('d_total'), p=document.getElementById('d_pay'), c=document.getElementById('d_cap');
  if(!t||!p||!c) return;
  var total=parseFloat(t.value)||0, pay=parseFloat(p.value)||0, cap=parseFloat(c.value)||0;
  var gap=pay-cap;
  var gapEl=document.getElementById('o_gap'), yearEl=document.getElementById('o_year'), payoffEl=document.getElementById('o_payoff'), v=document.getElementById('o_verdict');
  if(pay===0&&cap===0&&total===0){ gapEl.textContent='—'; yearEl.textContent='—'; payoffEl.textContent='—'; v.style.display='none'; return; }
  gapEl.textContent=(gap>0?'-':'+')+fmt(Math.abs(gap)).slice(1);
  gapEl.parentElement.querySelector('span').textContent=gap>0?'Short each month':'Cushion each month';
  yearEl.textContent=gap>0?fmt(gap*12):fmt(0);
  if(cap>0&&total>0){ var yrs=total/(cap*12); payoffEl.textContent=yrs>50?'50+':yrs.toFixed(1); } else { payoffEl.textContent='∞'; }
  v.style.display='block';
  if(gap>0){ v.className='verdict warn'; v.innerHTML='The payment is bigger than the capacity by <b>'+fmt(gap)+'/mo</b>. On these numbers the debt isn’t being carried — it’s being funded by runway. That’s the case for attacking the amount (negotiate / restructure / settle) before it eats the cushion.'; }
  else { v.className='verdict ok'; v.innerHTML='On these numbers the payment fits inside the capacity, with about <b>'+fmt(Math.abs(gap))+'/mo</b> to spare. Tight, maybe — but survivable. The lower-risk roads (restructure, pay down) are very much in play.'; }
}
function wireCalc(){
  ['d_total','d_pay','d_cap'].forEach(function(id){ var el=document.getElementById(id); if(el) el.addEventListener('input', calc); });
  calc();
}
</script>
