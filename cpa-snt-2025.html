<style>
:root{--g:#1b7a3d;--ink:#1a1a1a;--mut:#666;--line:#e3e3e3;--bg:#f6f7f6}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 -apple-system,Segoe UI,Roboto,Arial;color:var(--ink);background:var(--bg)}
.wrap{max-width:880px;margin:0 auto;padding:24px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px;box-shadow:0 1px 3px rgba(0,0,0,.05)}

tr.net td{font-weight:800;font-size:15px;border-top:2px solid var(--g);background:#f0f8f3}.meta{color:var(--mut);font-size:12px}
.memo{margin-top:14px;font-size:12px;color:var(--mut);background:#fafafa;border:1px solid var(--line);border-radius:8px;padding:10px}
.dl{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}.dl a{flex:1;min-width:200px;text-decoration:none;border:1px solid var(--g);color:var(--g);border-radius:9px;padding:11px 14px;font-weight:600;text-align:center}
.dl a:hover{background:var(--g);color:#fff}.foot{color:var(--mut);font-size:12px;margin-top:20px;text-align:center}

function b64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function unlock(){
 const pw=document.getElementById('pw').value, err=document.getElementById('err'); err.textContent='Decrypting…';
 try{
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(BLOB.s),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(BLOB.i)},key,b64(BLOB.c));
  const data=JSON.parse(new TextDecoder().decode(pt));
  let dl='<div class=dl>';
  for(const f of data.files){const mime=f.name.endsWith('.csv')?'text/csv':'text/plain';dl+='<a download="'+f.name+'" href="data:'+mime+';base64,'+f.b64+'">⬇ '+f.name+'</a>'}
  dl+='</div>';
  document.getElementById('content').innerHTML='<div class=card>'+data.pl+dl+'</div>';
  document.getElementById('gate').style.display='none';
  document.getElementById('content').style.display='block';
  document.getElementById('ff').style.display='block';
 }catch(e){err.textContent='Incorrect password.';}
}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
</script></body></html>
