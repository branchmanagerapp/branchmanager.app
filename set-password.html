<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Set Your Password — Branch Manager</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f6f8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.08);padding:28px 22px;width:100%;max-width:400px}
  h1{font-size:20px;color:#1a3c12;margin-bottom:6px}
  p{font-size:14px;color:#555;margin-bottom:18px;line-height:1.5}
  label{display:block;font-size:13px;font-weight:700;color:#333;margin:12px 0 5px}
  input{width:100%;padding:13px;border:1.5px solid #d8dce1;border-radius:10px;font-size:16px}
  input:focus{outline:none;border-color:#1a5c2a}
  button{width:100%;margin-top:20px;background:#1a5c2a;color:#fff;border:none;padding:15px;border-radius:10px;font-size:16px;font-weight:800;cursor:pointer}
  button:disabled{opacity:.6}
  .err{display:none;background:#fde8e8;color:#842029;border-radius:8px;padding:10px 12px;font-size:13px;margin-top:14px}
  .ok{display:none;text-align:center}
  .ok .big{font-size:44px;margin-bottom:10px}
  .ok a{display:inline-block;margin-top:16px;background:#1a5c2a;color:#fff;text-decoration:none;padding:14px 26px;border-radius:10px;font-weight:800}
</style>
</head>
<body>
<div class="card">
  <div id="form-part">
    <h1>🌳 Welcome to the team</h1>
    <p>Choose a password for your Branch Manager account. You'll use it with your email address to sign in.</p>
    <label for="p1">New password (8+ characters)</label>
    <input id="p1" type="password" autocomplete="new-password">
    <label for="p2">Type it again</label>
    <input id="p2" type="password" autocomplete="new-password">
    <button id="go" onclick="submitPw()">Set Password</button>
    <div class="err" id="err"></div>
  </div>
  <div class="ok" id="ok-part">
    <div class="big">✅</div>
    <h1>You're all set<span id="ok-name"></span>!</h1>
    <p style="margin-top:8px">Sign in with <strong id="ok-email"></strong> and the password you just chose.</p>
    <a href="https://branchmanager.app">Open Branch Manager →</a>
  </div>
</div>
<script>
function submitPw(){
  var t=new URLSearchParams(location.search).get('t')||'';
  var p1=document.getElementById('p1').value, p2=document.getElementById('p2').value;
  var err=document.getElementById('err'), btn=document.getElementById('go');
  err.style.display='none';
  if(p1.length<8){err.textContent='Password must be at least 8 characters.';err.style.display='block';return;}
  if(p1!==p2){err.textContent='Passwords do not match.';err.style.display='block';return;}
  btn.disabled=true;btn.textContent='Saving…';
  fetch('https://ltpivkqahvplapyagljt.supabase.co/functions/v1/team-set-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:t,password:p1})})
    .then(function(r){return r.json();}).then(function(d){
      if(d&&d.ok){
        document.getElementById('form-part').style.display='none';
        document.getElementById('ok-part').style.display='block';
        if(d.name)document.getElementById('ok-name').textContent=', '+d.name.split(' ')[0];
        document.getElementById('ok-email').textContent=d.email||'your email';
      } else {
        err.textContent=(d&&d.error)||'Something went wrong — ask Doug for a fresh invite.';
        err.style.display='block';btn.disabled=false;btn.textContent='Set Password';
      }
    }).catch(function(){err.textContent='Network problem — try again.';err.style.display='block';btn.disabled=false;btn.textContent='Set Password';});
}
</script>
</body>
</html>
