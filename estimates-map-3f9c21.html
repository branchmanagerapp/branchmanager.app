<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#0a2e18">
<title>Estimates & Jobs — Map</title>
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
header{background:linear-gradient(155deg,#0a2e18,#1f7a43);color:#fff;padding:16px 16px 14px;text-align:center}
header h1{margin:0;font-size:19px;font-weight:800}
header a{color:#cfe9d9;font-size:13px;text-decoration:none}
#map{height:52vh;width:100%}
.bar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.fb{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:20px;padding:7px 13px;font-size:13px;font-weight:700}
.fb.on{background:var(--green);color:#fff;border-color:var(--green)}
.list{padding:8px 14px 50px;max-width:760px;margin:0 auto}
.row{display:flex;gap:10px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line)}
.row .amt{margin-left:auto;font-weight:800;color:var(--green-d);white-space:nowrap}
.row .nm{font-weight:700}.row .ad{color:var(--muted);font-size:13px}
.pill{font-size:10px;font-weight:800;text-transform:uppercase;padding:2px 7px;border-radius:20px;color:#fff;white-space:nowrap}
.date{font-size:11px;color:var(--faint);font-weight:700}
.age{font-size:10px;color:#b06a1a;font-weight:700;margin-left:5px}
</style></head><body>
<header><h1>🗺️ Estimates &amp; Jobs</h1><a href="ground-control-7c3f9a.html">‹ Ground Control</a></header>
<div class="bar" id="bar"></div>
<div id="map"></div>
<div class="list" id="list"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var PINS=[{"name": "Adam Melish #533", "addr": "68 Cedar Ave, Poughkeepsie, NY 12603", "status": "quote", "amt": "$3,800", "lat": 41.6759422, "lng": -73.9052749, "date": "2026-07-08"}, {"name": "Oswald #514", "addr": "26 N 2nd St, Cortlandt Manor, NY", "status": "sent", "amt": "$7,300", "lat": 41.2859824, "lng": -73.8555983, "date": "2026-07-06"}, {"name": "Tanisha #515", "addr": "24 N 2nd St, Cortlandt Manor, NY", "status": "sent", "amt": "$1,000", "lat": 41.2862305, "lng": -73.8556446, "date": "2026-07-06"}, {"name": "Ricardo (paid)", "addr": "8 Barger St, Cortlandt Manor, NY", "status": "done", "amt": "cash", "lat": 41.329265, "lng": -73.8789479, "date": "2026-07-06"}, {"name": "144 Putnam Rd", "addr": "144 Putnam Rd, Continental Village, NY", "status": "done", "amt": "storm", "lat": 41.3327884, "lng": -73.9098627, "date": "2026-07-06"}, {"name": "2801 Sarles Dr", "addr": "2801 Sarles Dr, Yorktown Heights, NY", "status": "done", "amt": "storm", "lat": 41.3046204, "lng": -73.7803514, "date": "2026-07-06"}, {"name": "Amanda #534", "addr": "100 Nassau Ave, Peekskill, NY", "status": "quote", "amt": "$3,500", "lat": 41.289811, "lng": -73.9204922, "approx": true, "date": "2026-07-08"}, {"name": "Arlene Richie #516", "addr": "3723 Sunnyside Rd, Shrub Oak, NY", "status": "quote", "amt": "$5,500", "lat": 41.321508, "lng": -73.8298696, "approx": true, "date": "2026-07-06"}, {"name": "Matt Green (cleanup)", "addr": "11 Country Lane, Philipstown NY (Armand's street)", "status": "job", "amt": "cleanup", "date": "2026-07-08", "lat": 41.3354377, "lng": -73.9243886}];
var COLORS={quote:"#1f7a43",sent:"#1d6fd6",job:"#b06a1a",done:"#8a94a0"};
var LABEL={quote:"Open quote",sent:"Sent",job:"Job",done:"Done"};
var FILTERS=[["all","All"],["quote","Open quotes"],["sent","Sent"],["job","Jobs"],["done","Done"]];
var cur="all";
var map=L.map("map"); var markers=[];
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
function ageStr(d){ if(!d)return""; var t=new Date(); var dt=new Date(d+"T12:00:00");
  var days=Math.round((t-dt)/86400000); if(days<=0)return"today"; if(days===1)return"1 day"; return days+" days"; }
function draw(){
  markers.forEach(function(m){map.removeLayer(m);}); markers=[];
  var pts=[];
  PINS.forEach(function(p){
    if(cur!=="all"&&p.status!==cur)return;
    var c=COLORS[p.status]||"#1f7a43";
    var m=L.circleMarker([p.lat,p.lng],{radius:9,color:"#fff",weight:2,fillColor:c,fillOpacity:1}).addTo(map);
    m.bindPopup("<b>"+p.name+"</b><br>"+p.addr+(p.approx?" <i>(approx)</i>":"")+"<br><b>"+p.amt+"</b>"+(p.date?" · "+p.date:""));
    markers.push(m); pts.push([p.lat,p.lng]);
  });
  if(pts.length) map.fitBounds(pts,{padding:[40,40]});
  // list — newest date first
  var rows=PINS.filter(function(p){return cur==="all"||p.status===cur;})
    .sort(function(a,b){return (b.date||"")<(a.date||"")?-1:1;});
  var h="";
  rows.forEach(function(p){
    var c=COLORS[p.status]||"#1f7a43";
    h+='<div class="row"><span class="pill" style="background:'+c+'">'+LABEL[p.status]+'</span>'+
       '<span><span class="nm">'+p.name+'</span><br><span class="ad">'+p.addr+(p.approx?" (approx)":"")+'</span><br>'+
       '<span class="date">'+(p.date||"—")+'</span><span class="age">'+ageStr(p.date)+'</span></span>'+
       '<span class="amt">'+p.amt+'</span></div>';
  });
  document.getElementById("list").innerHTML=h||'<div style="padding:20px;color:#8a94a0">None in this filter.</div>';
}
var bar=document.getElementById("bar");
FILTERS.forEach(function(f){
  var b=document.createElement("button"); b.className="fb"+(f[0]==="all"?" on":""); b.textContent=f[1];
  b.onclick=function(){cur=f[0]; [].forEach.call(bar.children,function(x){x.classList.remove("on");}); b.classList.add("on"); draw();};
  bar.appendChild(b);
});
draw();
</script>
</body></html>
