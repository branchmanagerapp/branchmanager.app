<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Areas We Serve — Second Nature Tree</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--green:#2e7d32;--green-d:#1f5c22;--ink:#1d1d1f;--muted:#6b7280;--line:#e6e6e6}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;color:var(--ink);background:#f5f5f7;line-height:1.5}
.hd{background:linear-gradient(135deg,#3a8f3e,#1f5c22);color:#fff;padding:22px 24px;text-align:center}
.hd .co{font-size:22px;font-weight:800}
.hd .sub{font-size:13.5px;opacity:.92;margin-top:3px}
.hd a{color:#fff;font-weight:700;text-decoration:none}
.wrap{max-width:1000px;margin:0 auto;padding:18px}
#map{height:520px;width:100%;border-radius:14px;box-shadow:0 4px 24px rgba(0,0,0,.10);overflow:hidden;z-index:0}
@media(max-width:600px){#map{height:60vh}}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:26px 0 10px}
.towns{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px;font-size:14px}
.towns div{padding:5px 2px;border-bottom:1px solid var(--line)}
.cta{margin:24px 0;background:#f3f8ec;border:1px solid #d8ebc2;border-radius:12px;padding:16px 18px;text-align:center;font-size:15px}
.cta b{color:var(--green-d)}
.cta a{display:inline-block;margin-top:8px;background:var(--green-d);color:#fff;text-decoration:none;font-weight:700;padding:11px 22px;border-radius:10px}
.ft{color:var(--muted);font-size:12px;text-align:center;padding:20px}
.leaflet-popup-content{font:14px/1.4 -apple-system,Arial;font-weight:600}
</style></head><body>
<div class="hd"><div class="co">🌳 Second Nature Tree</div><div class="sub">Areas We Serve · Westchester &amp; Putnam County, NY · <a href="tel:19143915233">(914) 391-5233</a></div></div>
<div class="wrap">
  <div id="map"></div>
  <h2>Towns &amp; areas we cover</h2>
  <div class="towns" id="townlist"></div>
  <div class="cta"><b>Don't see your town?</b> We travel — give us a call and we'll let you know.<br><a href="tel:19143915233">📞 Call (914) 391-5233</a></div>
</div>
<div class="ft">Second Nature Tree LLC · Peekskill, NY · (914) 391-5233 · Coverage area shown is approximate.</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var HQ=[41.290,-73.920];
var towns=[
 ["Peekskill",41.290,-73.920],["Cortlandt Manor",41.297,-73.882],["Mohegan Lake",41.318,-73.851],
 ["Yorktown Heights",41.271,-73.777],["Croton-on-Hudson",41.202,-73.892],["Ossining",41.163,-73.861],
 ["Putnam Valley",41.399,-73.845],["Mahopac",41.372,-73.744],["Carmel",41.430,-73.680],
 ["Somers",41.331,-73.696],["Katonah",41.256,-73.685],["Bedford",41.204,-73.643],
 ["Mount Kisco",41.204,-73.727],["Chappaqua",41.159,-73.764],["Pleasantville",41.135,-73.793],
 ["Brewster",41.397,-73.617],["Jefferson Valley",41.323,-73.799],["Shrub Oak",41.328,-73.826]
];
var map=L.map('map',{scrollWheelZoom:false}).setView([41.30,-73.80],10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
// approximate coverage polygon (Westchester N + Putnam S)
var area=[[41.47,-73.98],[41.47,-73.55],[41.34,-73.52],[41.10,-73.60],[41.08,-73.90],[41.20,-73.99]];
L.polygon(area,{color:'#1f5c22',weight:2,fillColor:'#2e7d32',fillOpacity:.14}).addTo(map);
var tl=document.getElementById('townlist');
towns.forEach(function(t){
  L.circleMarker([t[1],t[2]],{radius:6,color:'#1f5c22',fillColor:'#2e7d32',fillOpacity:.9,weight:2}).addTo(map).bindPopup(t[0]);
  var d=document.createElement('div');d.textContent=t[0];tl.appendChild(d);
});
L.marker(HQ).addTo(map).bindPopup('<b>Second Nature Tree</b><br>Peekskill, NY').openPopup();
</script>
</body></html>
