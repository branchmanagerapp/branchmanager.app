  .left { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
  .headline {
    font-weight: 900;
    color: #1d1d1f;
    font-size: 2.8in;
    line-height: 0.97;
    letter-spacing: -0.055in;
  }
  .headline .accent { color: #4a8a10; }

    font-weight: 700;
    color: #1d1d1f;

    margin-top: 0.5in;
    color: #1a3a5c !important;
  }

    color: #4a8a10;
    font-size: 2.0in;
    letter-spacing: -0.05in;

  .right {
    width: 5.6in; flex: none;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 0.3in;
  }
  .qrbox {
    width: 5.6in; height: 5.6in;
    background: #fff;
    border: 0.09in solid #1d1d1f;
    border-radius: 0.25in;
    padding: 0.3in;
  }
  .qrbox svg { width: 100%; height: 100%; }
  .qrcta {
    font-weight: 900;
    color: #4a8a10;
    font-size: 0.62in;
    text-align: center;
    line-height: 1.15;
    text-transform: uppercase;
  }
  .bar {
    height: 3.1in;
    background: #6abb1e;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 1.1in;
  }
  .domain {
    font-weight: 900;
    color: #ffffff;
    font-size: 1.3in;
    letter-spacing: -0.02in;
    white-space: nowrap;
  }
  .dealer {

    color: #ffffff;
    font-size: 0.52in;
    text-align: right;
    white-space: nowrap;
    line-height: 1.25;
  }
  @media screen {
    body { display: flex; justify-content: center; padding: 20px; }
    .wrap { transform-origin: top center; }
