<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#0a0d0b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Approve work"><title>Approve work days</title>
<style>
:root{--bg:#0a0d0b;--card:rgba(255,255,255,.04);--ink:#edf1ed;--mut:#8a968d;--faint:#5c6860;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);--acc:#6fbf8f;--warn:#d9a05b;--red:#e07070;--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;--serif:ui-serif,"Iowan Old Style",Palatino,Georgia,serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.45;padding-bottom:70px}
.wrap{max-width:660px;margin:0 auto;padding:0 14px}
header{padding:22px 0 8px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
h1{font-family:var(--serif);font-size:26px;font-weight:500;margin:0;letter-spacing:-.01em}
.tabs{display:flex;gap:6px}.tabs button{border:1px solid var(--line2);background:var(--card);color:var(--mut);border-radius:20px;padding:6px 11px;font:600 12px var(--sans)}.tabs button.on{background:var(--acc);border-color:var(--acc);color:#06110a}
.card{border:1px solid var(--line2);background:var(--card);border-radius:14px;padding:12px;margin-top:12px}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}.tt{font-size:16px;font-weight:700}.sub{font-size:12.5px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.ph{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;background:#111;border:2px solid transparent}
.ph img,.ph video{width:100%;height:100%;object-fit:cover;display:block}
.ph.off{opacity:.35}.ph.cover{border-color:var(--acc)}
.ph .k{position:absolute;left:5px;top:5px;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:rgba(0,0,0,.55);color:#fff;padding:2px 5px;border-radius:6px}
.ph .x{position:absolute;right:5px;top:5px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:22px;text-align:center}
.row{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
select,input{font:14px var(--sans);background:#111;color:var(--ink);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;flex:1;min-width:120px}
.btn{border:0;border-radius:11px;padding:11px 14px;font:700 14px var(--sans);flex:1;min-width:110px}
.ok{background:var(--acc);color:#06110a}.skip{background:transparent;color:var(--mut);border:1px solid var(--line2)}.undo{background:transparent;color:var(--warn);border:1px solid var(--warn)}
.note{font-size:12px;color:var(--faint);margin-top:10px}
.empty{color:var(--mut);padding:30px 0;text-align:center;font-size:14px}
.err{color:var(--red);padding:20px 0;font-size:14px}
.hint{font-size:12px;color:var(--faint);line-height:1.5;margin-top:6px}
</style></head><body><div class="wrap">
<header><h1>Approve work days</h1><div class="tabs"><button class="on" data-s="draft">New</button><button data-s="approved">Live</button><button data-s="skipped">Skipped</button></div></header>
<p class="hint">Tap a photo to drop it. Tap ★ on a photo to make it the cover. Approve = goes on the public map (town + date only, never a name or address). Skip = keep private.</p>
<div id="list"><div class="empty">Loading…</div></div>
</div>
<script>
(function(){
 var FN='https://ltpivkqahvplapyagljt.supabase.co/functions/v1/work-days';
 var key=(location.hash||'').replace(/^#/,'').replace(/^key=/,'');
 try{ if(key) localStorage.setItem('work-key',key); else key=localStorage.getItem('work-key')||''; }catch(e){}
 var list=document.getElementById('list'), status='draft';
 var SERVICES=['Tree removal','Pruning','Storm cleanup','Crane removal','Stump grinding','Land clearing','Firewood','Line clearance','Other'];
 if(!key){ list.innerHTML='<div class="err">No key. Open this page from the link Claude gave you (it ends with #key=…).</div>'; return; }
 document.querySelectorAll('.tabs button').forEach(function(b){ b.onclick=function(){ document.querySelectorAll('.tabs button').forEach(function(x){x.classList.remove('on')}); b.classList.add('on'); status=b.getAttribute('data-s'); load(); }; });
 function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}); }
 function load(){
  list.innerHTML='<div class="empty">Loading…</div>';
  fetch(FN+'?key='+encodeURIComponent(key)+'&status='+status).then(function(r){return r.json()}).then(function(d){
   if(!d.ok){ list.innerHTML='<div class="err">'+esc(d.error||'error')+'</div>'; return; }
   if(!d.rows.length){ list.innerHTML='<div class="empty">Nothing here.</div>'; return; }
   list.innerHTML=''; d.rows.forEach(render);
  }).catch(function(e){ list.innerHTML='<div class="err">'+esc(e.message)+'</div>'; });
 }
 function render(w){
  var card=document.createElement('div'); card.className='card'; card.dataset.id=w.id;
  var keep={}; (w.photos||[]).forEach(function(p){keep[p.path]=true}); var cover=w.cover_path;
  var d=new Date(w.work_date+'T12:00:00'); var dstr=d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
  card.innerHTML='<div class="hd"><div class="tt">'+esc(w.town||'?')+' · '+dstr+'</div><div class="sub">'+esc(w.client_name||'')+(w.job_number?' · job #'+w.job_number:'')+' · '+w.photo_count+' files</div></div>'
   +'<div class="grid"></div>'
   +'<div class="row"><select class="svc"><option value="">Service…</option>'+SERVICES.map(function(s){return '<option'+(w.service===s?' selected':'')+'>'+s+'</option>'}).join('')+'</select><input class="blurb" placeholder="One line for the public card (optional)" value="'+esc(w.blurb||'')+'"></div>'
   +'<div class="row">'+(status==='draft'?'<button class="btn ok">Approve</button><button class="btn skip">Skip</button>':status==='skipped'?'<button class="btn undo">Back to new</button>':'<span class="note">Live on the public map.</span>')+'</div><div class="note"></div>';
  var grid=card.querySelector('.grid');
  (w.photos||[]).forEach(function(p){
   var el=document.createElement('div'); el.className='ph'+(p.path===cover?' cover':''); el.dataset.path=p.path;
   var src=p.url||p.public_url||'';
   el.innerHTML=(p.kind==='video'?'<video src="'+esc(src)+'" muted playsinline preload="metadata"></video>':'<img src="'+esc(src)+'" loading="lazy" alt="">')+'<span class="k">'+(p.kind==='video'?'video':'photo')+'</span>'+(status==='draft'?'<span class="x" title="cover">★</span>':'');
   if(status==='draft'){
    el.onclick=function(ev){ if(ev.target.classList.contains('x')){ cover=p.path; grid.querySelectorAll('.ph').forEach(function(x){x.classList.toggle('cover',x.dataset.path===cover)}); return; } keep[p.path]=!keep[p.path]; el.classList.toggle('off',!keep[p.path]); };
   }
   grid.appendChild(el);
  });
  function post(body,label){
   var note=card.querySelector('.note'); note.textContent=label+'…'; card.querySelectorAll('.btn').forEach(function(b){b.disabled=true});
   body.key=key; body.id=w.id;
   return fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json()}).then(function(d){
    if(!d.ok){ note.textContent='Failed: '+(d.error||''); card.querySelectorAll('.btn').forEach(function(b){b.disabled=false}); return; }
    card.style.transition='opacity .3s'; card.style.opacity='0'; setTimeout(function(){card.remove(); if(!list.children.length) list.innerHTML='<div class="empty">All caught up.</div>';},320);
   });
  }
  var ok=card.querySelector('.ok'); if(ok) ok.onclick=function(){ var kept=Object.keys(keep).filter(function(k){return keep[k]}); if(!kept.length){card.querySelector('.note').textContent='Keep at least one photo.';return;} post({action:'approve',keep:kept,cover:cover,service:card.querySelector('.svc').value||null,blurb:card.querySelector('.blurb').value||null},'Publishing'); };
  var sk=card.querySelector('.skip'); if(sk) sk.onclick=function(){ post({action:'skip'},'Skipping'); };
  var un=card.querySelector('.undo'); if(un) un.onclick=function(){ post({action:'unskip'},'Restoring'); };
  list.appendChild(card);
 }
 load();
})();
</script></body></html>
