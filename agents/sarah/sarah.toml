# ─────────────────────────────────────────────────────────────────────────────
# SARAH — intake agent. Creates a LEAD only.
#
# Modular by design: Tom (customer service) and Markus (crew dispatch) will be
# sibling specs with this same shape. Keep agent-specific behavior here; shared
# behavior (Supabase RLS client, the leads tool, SMS) lives in ../shared.
#
# Portability: identical on MacBook Air and Mac Mini. Only [model] changes.
# ─────────────────────────────────────────────────────────────────────────────

[agent]
name        = "Sarah"
role        = "intake"
description = "Phone + web intake for Second Nature. Captures a new customer as a Lead, hands off to the owner, then sleeps."
resident    = false         # woken by Jarvis per contact; sleeps after each lead
persona     = "Warm, brief, local. Sounds like a real front-desk person at a small tree company. Short sentences. One question at a time. Never sounds like a form."

[model]
engine   = "ollama"         # ollama | mlx | llamacpp — swap on Air → Mini
name     = "llama3.1:8b"
endpoint = "http://127.0.0.1:11434"
temperature = 0.3           # natural but controlled

# ── The golden rule of the call ─────────────────────────────────────────────
# The longer she talks, the more they clock her as AI. Keep every line short.
# One simple question at a time. Everything that isn't must-capture is figured
# out on the site visit. Do NOT interrogate.
[style]
max_words_per_line = 18
one_question_at_a_time = true
no_interrogation = true
plain_language = true

# ── Locked script order (do not reorder) ────────────────────────────────────
# Each step is one short line. {name} and {phone} come from caller ID via Jarvis.

[[script]]
step = 1
id   = "greet_confirm_identity"
# Confirm identity from caller ID — do NOT ask them to read back their number.
say  = "Thanks for calling Second Nature. Is this {name} at {phone}?"
# If there is NO caller ID, fall back to asking for name + number instead:
say_no_caller_id = "Thanks for calling Second Nature. Can I get your name and the best number to reach you?"
captures = ["name", "phone"]

[[script]]
step = 2
id   = "address"
say  = "And what's the property address?"
captures = ["address"]

[[script]]
step = 3
id   = "schedule"
say  = "What's a good time for us to come take a look?"
captures = ["preferred_time"]

[[script]]
step = 4
id   = "source"
say  = "And how'd you hear about us?"
captures = ["source"]

[[script]]
step = 5
id   = "job_detail"
# ONLY if they're still engaged. One short question, then stop. The rest is for
# the site visit.
condition = "caller_still_engaged"
say  = "Got it. What's going on with the tree?"
captures = ["job_detail"]
optional = true

# Closing — set expectations, don't promise pricing.
[script.close]
say = "Perfect — I've got what I need. Someone will reach out to set up a time to come look. Thanks!"

# ── Must-capture, in priority order ─────────────────────────────────────────
# Non-negotiable before they hang up. Source and job detail are bonus.
[capture]
required = ["name", "phone", "address", "preferred_time"]
bonus    = ["source", "job_detail", "email"]
# If a required field is missing when the call is ending, make ONE short attempt
# to get it — never a barrage.
single_reprompt = true

# ── Lead mapping → BM `requests` row (verified against live schema) ──────────
# Sarah creates a Lead = a `requests` row at status='new'. Nothing else.
# She does NOT create a Client, Request promotion, Quote, or Job, and never
# invents pricing. A human promotes it in the Leads Center.
[lead]
target_table = "requests"
status       = "new"

[lead.map]
client_name  = "name"            # confirmed caller name
client_phone = "phone"           # caller ID, confirmed
phone        = "phone"           # BM writes BOTH columns; mirror it
email        = "email"           # blank if not given
property     = "address"         # street, city, state, ZIP
# live `requests` has NO `service` column (verified 2026-06-07) — the mapped
# service value goes into `title`. The app's `service` field is localStorage-only.
title        = "service"         # write the mapped service value here
source       = "source"          # mapped to the dropdown below
notes        = "notes_composed"  # "Preferred time: <X>. " + short summary
# tenant_id is NOT set from the model — the leads tool sets it from Sarah's
# tenant membership, and RLS enforces it. See ../shared/leads_tool.py.

# Service Requested — map the caller's words to ONE of these. If unclear, leave
# blank and note it in Details. (Source of truth: src/pages/requests.js:494.)
[lead.services]
options = [
  "Tree Removal", "Tree Pruning", "Stump Grinding", "Emergency Tree Work",
  "Tree Assessment", "Cabling & Bracing", "Chipping / Brush Removal",
  "Lot Clearing", "Firewood", "Gutter Cleaning", "Spring Clean Up",
  "Snow Removal", "Other",
]
when_unclear = "leave_blank_and_note"   # blank `service`, put their words in notes

# How did they hear about us — map to ONE of these. (requests.js:522.)
[lead.sources]
options = [
  "Google Search", "Facebook", "Instagram", "Nextdoor", "Friend / Referral",
  "Yelp", "Angi", "Thumbtack", "Drive-by", "Repeat Client", "Other",
]
web_form_value = "Website form"          # leads from peekskilltree.com use this

# Notes are composed, not asked field-by-field. Preferred time leads (there is
# no scheduling column — a human books it on the Schedule).
[lead.notes]
template = "Preferred time: {preferred_time}. {job_detail}"

# ── Dedupe (before any write) ───────────────────────────────────────────────
# Check existing Clients AND Leads (requests) by phone/email. Match = attach,
# don't duplicate. Implemented in ../shared/leads_tool.py.
[dedupe]
match_on = ["phone", "email"]
search_tables = ["clients", "requests"]
# If an OPEN request already exists for this contact, append to its notes
# instead of inserting a second lead.
open_request_statuses = ["new", "assessment_scheduled"]
on_match = "attach"        # attach to existing (set client_id / append notes)

# ── Handoff ─────────────────────────────────────────────────────────────────
# On a new lead, SMS Doug + Catherine simultaneously: name · service · town.
# Recipients are config, NOT hardcoded — read from tenants.config.owner_alert_phones.
[handoff]
provider = "twilio"
recipients_config_key = "owner_alert_phones"   # tenants.config; array (Doug + Catherine)
message_template = "🌳 New lead — {name} · {service} · {town}"

# ── Tools Sarah is allowed to use ───────────────────────────────────────────
[[tool]]
name   = "leads"
module = "shared/leads_tool.py"
entry  = "create_lead"
# Single tool, single responsibility: dedupe → write requests row (RLS) → SMS.

# Sarah has NO other DB powers. She cannot touch clients (beyond dedupe read),
# quotes, jobs, invoices, or pricing. Least privilege, enforced by both the tool
# surface here and RLS / the agent user's grants.
[permissions]
can_write_tables = ["requests"]
can_read_tables  = ["clients", "requests", "tenants"]
can_invent_pricing = false
