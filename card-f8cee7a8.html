<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Doug Brown — Tap to Share</title>
<style>
:root{--ink:#14181f;--muted:#6b7280;--line:#e6e8ec;--card:#fff;}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(160deg,#1c2431,#0f1115);color:var(--ink);min-height:100vh;padding:22px 14px 60px}
.wrap{max-width:440px;margin:0 auto}
.top{color:#fff;text-align:center;margin-bottom:14px}
.top .nm{font-size:26px;font-weight:800}
.top .sub{font-size:13px;opacity:.8;margin-top:2px}
details{background:var(--card);border-radius:16px;margin:10px 0;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.25)}
summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;align-items:center;gap:12px;font-size:16px;font-weight:800}
summary::-webkit-details-marker{display:none}
summary .em{font-size:22px}
summary .cv{margin-left:auto;color:var(--muted);font-size:13px;font-weight:600}
details[open] summary{border-bottom:1px solid var(--line)}
.inner{padding:8px 14px 16px}
.f{display:flex;align-items:center;gap:10px;padding:10px 8px;border:1px solid var(--line);border-radius:11px;margin:7px 0;cursor:pointer}
.f.on{border-color:var(--acc,#1b7f3b);background:var(--accbg,#eef7f0)}
.f .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.f .v{font-size:14.5px;font-weight:600}
.f .lbl{flex:1}
.f .chk{width:19px;height:19px;border-radius:50%;border:2px solid #c3c8cf;flex:0 0 auto}
.f.on .chk{background:var(--acc,#1b7f3b);border-color:var(--acc,#1b7f3b);position:relative}
.f.on .chk:after{content:"✓";color:#fff;font-size:12px;position:absolute;top:-1px;left:3px}
.btn{display:block;width:100%;margin-top:10px;padding:14px;border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:800;cursor:pointer;background:var(--acc,#1b7f3b)}
.btn.alt{background:#fff;border:2px solid var(--acc,#1b7f3b);color:var(--acc,#1b7f3b);margin-top:6px}
.foot{color:#8b93a1;font-size:11.5px;text-align:center;margin-top:16px}
</style></head><body><div class="wrap">
<div class="top"><div class="nm">Doug Brown</div><div class="sub">Tap a business → pick what to share → add to their phone</div></div>
<div id="app"></div>
<p class="foot">White-label contact card. Edit the <code>PROFILES</code> block to rebrand or fix any detail. Fields marked ✎ need your info.</p>
</div>
<script>
// ===== CONFIG (white-label: edit here) =====
const CARD_OWNER="Doug Brown";
const PROFILES=[
 {id:"tree",name:"Second Nature Tree",em:"🌳",color:"#1b7f3b",cbg:"#eef7f0",org:"Second Nature Tree Service",fields:[
   {k:"tel",lbl:"Phone",v:"+19147378522",show:"(914) 737-8522",on:true},
   {k:"email",lbl:"Email",v:"info@peekskilltree.com",show:"info@peekskilltree.com",on:true},
   {k:"url",lbl:"Website",v:"https://peekskilltree.com",show:"peekskilltree.com",on:true}]},
 {id:"lawn",name:"SmartLawn NY",em:"🌱",color:"#4a8a10",cbg:"#f0f7e6",org:"SmartLawn NY",fields:[
   {k:"tel",lbl:"Phone",v:"+19146477276",show:"(914) 647-7276",on:true},
   {k:"email",lbl:"Email",v:"smartlawnny@gmail.com",show:"smartlawnny@gmail.com",on:true},
   {k:"url",lbl:"Website",v:"https://smartlawnny.com",show:"smartlawnny.com",on:true}]},
 {id:"skate",name:"2nd Nature Skate Park",em:"🛹",color:"#7a3ff0",cbg:"#f0ecfb",org:"2nd Nature Skatepark",fields:[
   {k:"email",lbl:"Email",v:"info@2ntr.com",show:"info@2ntr.com",on:true},
   {k:"url",lbl:"Website",v:"https://skateos.com",show:"skateos.com",on:true},
   {k:"tel",lbl:"Phone ✎",v:"",show:"add park phone",on:false}]},
 {id:"dev",name:"Web Development / Branch Manager",em:"💻",color:"#0b5c8a",cbg:"#e7f2f8",org:"Branch Manager",fields:[
   {k:"url",lbl:"Website",v:"https://branchmanager.app",show:"branchmanager.app",on:true},
   {k:"email",lbl:"Email ✎",v:"doug@2ntr.com",show:"doug@2ntr.com",on:true}]},
 {id:"me",name:"Doug Brown (personal)",em:"👤",color:"#374151",cbg:"#eef0f3",org:"",fields:[
   {k:"email",lbl:"Email",v:"doug@2ntr.com",show:"doug@2ntr.com",on:true},
   {k:"tel",lbl:"Cell ✎",v:"",show:"add your cell",on:false}]},
];
// ===========================================
const app=document.getElementById("app");
PROFILES.forEach(p=>{
  const d=document.createElement("details");
  d.style.setProperty("--acc",p.color); d.style.setProperty("--accbg",p.cbg);
  d.innerHTML=`<summary><span class="em">${p.em}</span> ${p.name}<span class="cv">tap</span></summary><div class="inner"></div>`;
  const inner=d.querySelector(".inner");
  p.fields.forEach((f,i)=>{
    const row=document.createElement("div"); row.className="f"+(f.on?" on":"");
    row.innerHTML=`<span class="lbl"><span class="k">${f.lbl}</span><br><span class="v">${f.show}</span></span><span class="chk"></span>`;
    if(!f.v){row.style.opacity=".55";}
    row.addEventListener("click",()=>{ if(f.v) row.classList.toggle("on"); });
    row._f=f; inner.appendChild(row);
  });
  const add=document.createElement("button"); add.className="btn"; add.textContent="📇 Add "+p.name+" to contacts";
  add.style.background=p.color;
  add.addEventListener("click",()=>addContact(p,inner));
  const sh=document.createElement("button"); sh.className="btn alt"; sh.textContent="Share this card"; sh.style.borderColor=p.color; sh.style.color=p.color;
  sh.addEventListener("click",shareCard);
  inner.appendChild(add); inner.appendChild(sh);
  app.appendChild(d);
});
function addContact(p,inner){
  let v=["BEGIN:VCARD","VERSION:3.0","N:Brown;Doug;;;","FN:"+CARD_OWNER];
  if(p.org) v.push("ORG:"+p.org);
  inner.querySelectorAll(".f.on").forEach(r=>{const f=r._f; if(!f.v)return;
    if(f.k==="tel") v.push("TEL;TYPE=CELL:"+f.v);
    if(f.k==="email") v.push("EMAIL:"+f.v);
    if(f.k==="url") v.push("URL:"+f.v);});
  v.push("END:VCARD");
  const blob=new Blob([v.join("\r\n")],{type:"text/vcard"});
  const url=URL.createObjectURL(blob); const a=document.createElement("a");
  a.href=url; a.download=CARD_OWNER.replace(/ /g,"-")+"-"+p.id+".vcf"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}
async function shareCard(){const data={title:CARD_OWNER,url:location.href};
  if(navigator.share){try{await navigator.share(data);}catch(e){}}else{try{navigator.clipboard.writeText(location.href);alert("Link copied.");}catch(e){}}}
</script></body></html>
